/* ---- 0.24: share picture, backups, your own small thing ---- */
.shareimg{display:block;width:min(100%,300px);height:auto;margin:4px auto 2px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.filepick{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer;overflow:hidden}
.filepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.filepick:focus-within{outline:3px solid var(--butter);outline-offset:2px}
.cal .c{position:relative}
.cal .c.own::after,#view-chronicle .cal span.c.own::after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;background:#F2B23E;box-shadow:0 0 0 1.5px var(--ink)}
.calkey i.ownkey{width:8px;height:8px;background:#F2B23E;box-shadow:0 0 0 1.5px var(--ink);vertical-align:1px}
.rowl.ownrow[aria-pressed="true"] .ri{color:#3E8E4F}
/* ---- 0.25: deeper games ---- */
.pgready{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 16px;background:rgba(16,11,34,.86);text-align:center;color:#F4EEFF}
.pgready img{width:64px;height:64px;image-rendering:pixelated}
.pgready p{margin:0;font-size:14px;line-height:1.35;color:#F4EEFF}
.pgready p b{color:#FFD36B;font-weight:700}
.pgready p.lock{color:#CFC6E8}
.pgready p.tw b{color:#FF9EB0}
.pgready .primary{min-width:150px;margin-top:4px}
.pgstreak{position:absolute;right:8px;top:6px;z-index:3;font:600 14px var(--display);color:#FFE9A8;text-shadow:0 1px 0 #000;pointer-events:none}
.pg .pgmsg{z-index:3;text-shadow:0 1px 0 #000;color:#F4EEFF;pointer-events:none}
.pt{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;pointer-events:none;z-index:3;animation:ptFly .5s ease-out forwards}
@keyframes ptFly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.ptx{position:absolute;z-index:3;pointer-events:none;font:600 16px var(--display);color:#FFF3B0;text-shadow:0 1px 0 #000;white-space:nowrap;transform:translate(-50%,-50%);animation:ptUp .7s ease-out forwards}
@keyframes ptUp{to{transform:translate(-50%,-160%);opacity:0}}
.pgend{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font:600 28px var(--display);color:#FFF3B0;text-shadow:0 2px 0 #000;background:rgba(0,0,0,.35);pointer-events:none;animation:pgPop .25s ease-out}
@keyframes pgPop{from{transform:scale(.7);opacity:0}}
.seed.gold::before{background:radial-gradient(circle,#FFF6C8 0 3px,transparent 3.5px),conic-gradient(from 0deg,#FFD36B 0 10%,transparent 10% 25%,#FFD36B 25% 35%,transparent 35% 50%,#FFD36B 50% 60%,transparent 60% 75%,#FFD36B 75% 85%,transparent 85%);box-shadow:0 0 10px 3px rgba(255,211,107,.55)}
.seed.thorn::before{background:#6B4A2E;box-shadow:0 0 0 2px #2E1E12;clip-path:polygon(50% 0,60% 30%,95% 20%,72% 48%,100% 70%,64% 68%,55% 100%,42% 70%,8% 82%,30% 52%,0 28%,38% 32%)}
.seed.thorn::after{background:#4B331F}
.seed.puff{width:64px;height:64px;z-index:2}
.seed.gold{z-index:1}
.seed.puff::before{left:12px;top:6px;width:40px;height:40px;background:radial-gradient(circle,#FFFFFF 0 5px,transparent 5.5px),repeating-conic-gradient(#F4F0E8 0 6deg,transparent 6deg 20deg);box-shadow:0 0 12px 4px rgba(255,255,255,.35)}
.seed.puff::after{left:31px;top:44px;height:18px}
.emb.log::before{inset:14px 6px;background:#9A6A3E;box-shadow:inset 0 -4px 0 #6B4A2E,0 0 0 3px #4B331F;clip-path:none;border-radius:2px}
.pg.wind{box-shadow:inset 0 0 50px 10px rgba(150,205,255,.55)}
.flake.big{width:32px;height:32px;margin-left:-16px;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
.flake.hail{clip-path:none;border-radius:50%;width:18px;height:18px;margin-left:-9px;background:#8CA3BA;box-shadow:inset -3px -3px 0 #5E7690}
.pg-dusk .pgmsg{top:2px;bottom:auto}
@media (prefers-reduced-motion: reduce){.pgend{animation:none}}
.moodbtn img.gpick{width:44px;height:44px;image-rendering:pixelated;flex:none}
.moodbtn.gwait{opacity:1;border-style:dashed}
.gwho{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.gwho button{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px 4px 6px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--display)}
.gwho button[aria-pressed="true"]{border-color:var(--plum);background:var(--chip)}
.gwho img{width:32px;height:32px;image-rendering:pixelated}
.moodbtn .home{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--butter);color:#2E2A47;font:700 12px var(--body);vertical-align:2px}
.otale{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.otale h3{margin:0 0 2px;font:600 17px var(--display)}
.otale .meta{margin:0 0 8px;color:var(--muted);font-size:13px}
.otale ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.otale li.gone{color:var(--muted);font-size:14px}
.otale li .g{display:inline-block;width:1.5em}
.otale li .world{border:0;padding:0;margin:0;display:inline}
.otale.whole{border-color:#E2B04A;box-shadow:inset 0 0 0 1px #E2B04A}
.otale .done{margin:8px 0 0;font-size:14px}
.mp-gold{stroke:#C9962E}
:root[data-theme="dark"] .mp-gold{stroke:#E2B04A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mp-gold{stroke:#E2B04A}}
ul.places{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
ul.places li{font-size:14px;line-height:1.35}
ul.places li.gone{color:var(--muted)}
ul.places li b{font-weight:700}
.mecho{border:1.5px dashed #E0A82E;border-radius:14px;padding:12px 14px;margin:8px 0;background:var(--surface)}
.mecho h2{margin:0 0 4px;font:600 16px var(--display)}
.mecho .q{margin:6px 0 0;color:var(--muted);font-size:13px}
.mecho .chips{margin-top:10px}
.mecho .chips button{min-height:44px}
.comp{margin:6px 0 0;font-size:14px}
.later{margin:2px 0 0;color:var(--muted);font-size:13px}
#modal .tale a,#modal p a{color:var(--plum);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0}
.gpick button{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.gpick button .gl{line-height:0}
.gpick button[aria-pressed="true"]{border-color:var(--plum);background:var(--chip)}
.giftcard{text-align:center}
.giftcard .gfrom{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px}
.giftcard .gfrom img{width:64px;height:64px;image-rendering:pixelated}
.giftcard .gcur{font-size:52px;line-height:1.1;margin:8px 0 0}
.giftnote{margin:10px 0 0;font:600 15px var(--display);color:#3B2E6E;background:rgba(255,246,207,.85);border-radius:12px;padding:8px 12px;display:inline-block}
.cimg{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.srow{margin:10px 0 0}.slab{font:600 13px var(--display);color:var(--muted)}
.splank{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 6px 0;border-bottom:7px solid #9A6A3E;box-shadow:0 3px 0 #5A3A22;border-radius:2px}
.scur{min-height:52px;background:none;border:0;padding:0 0 2px;display:grid;place-items:end center;cursor:pointer;border-radius:8px}
.scur:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.scur.off .cimg{opacity:.32}
.cbig{display:grid;place-items:center;margin:4px 0 2px}
.cbig .cimg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.cpop{animation:cpop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes cpop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.gcur{position:relative;height:104px;margin:6px 0 0}
.gcur .cimg{position:absolute;left:50%;top:4px;margin-left:-48px}
.gcur .gbun{animation:gbun 1.1s ease-in both}.gcur .gitem{animation:gitem .5s cubic-bezier(.3,1.6,.5,1) 1s both}
@keyframes gbun{0%{transform:none}15%{transform:rotate(-8deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(0) scale(1.08);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes gitem{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.reduce .cpop,.reduce .gcur .gitem{animation:none}.reduce .gcur .gbun{display:none}
@media (prefers-reduced-motion: reduce){.cpop,.gcur .gitem{animation:none}.gcur .gbun{display:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scur:not(.off) .cimg,:root:not([data-theme="light"]) .cbig .cimg,:root:not([data-theme="light"]) .gcur .cimg,:root:not([data-theme="light"]) .gpick .cimg{filter:drop-shadow(0 0 1px rgba(255,246,207,.6))}}
:root[data-theme="dark"] .scur:not(.off) .cimg,:root[data-theme="dark"] .cbig .cimg,:root[data-theme="dark"] .gcur .cimg,:root[data-theme="dark"] .gpick .cimg{filter:drop-shadow(0 0 1px rgba(255,246,207,.6))}
/* Nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);z-index:20;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:460px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:13px;font-weight:700;position:relative}
.tab[aria-current="page"]{color:var(--plum)}
.tab svg{width:26px;height:26px}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:#E5575F;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px}

/* Sheets and overlays */
.scrim{position:fixed;inset:0;background:rgba(20,18,40,.58);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.scrim.dark{align-items:center;background:radial-gradient(circle at 50% 35%,#3A2C6E,#0C0A1C)}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:28px 28px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:94dvh;overflow:auto;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
.ov{width:100%;max-width:460px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:12px;max-height:100dvh;overflow:auto;color:#fff}
.ov .rv-title{font:600 20px var(--display);text-align:center}
.ov .rv-hint{color:#D9D2F5;font-size:15px;text-align:center}
.ov .btnrow{width:100%;max-width:340px}
.ov .primary{background:#FFD36B;color:#2E2A47;max-width:340px}
.ov .primary.alt{background:rgba(255,255,255,.16);color:#fff}
.ov .note{display:block;width:100%;max-width:320px;text-align:left}
.ov .note span{display:block;font-size:14px;color:#D9D2F5;margin-bottom:4px}
.ov .note input{width:100%;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:11px 12px;font:inherit}
.ov .note input::placeholder{color:#B9B2DA}
.sumgrid{display:grid;grid-template-columns:repeat(3,auto);gap:12px;justify-content:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.moodbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;margin-top:10px}
.moodbtn b{font:600 18px var(--display)} .moodbtn span{color:var(--muted);font-size:14px;display:block;line-height:1.3}
.moodbtn i{font-style:normal;font-size:30px}
.packbtn{background:none;border:0;padding:0}
.packbtn svg{width:min(210px,56vw);height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:float 2.6s ease-in-out infinite}
.packbtn.opening svg{animation:shake .6s ease-in-out}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) scale(1.04)}35%{transform:rotate(7deg) scale(1.06)}55%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(5deg) scale(1.1)}}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px 0 0 -4px;pointer-events:none;animation:burst .95s steps(8,end) forwards;z-index:5}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* Today's Vector card (first run and "see the full card") */
.flip{perspective:1100px;width:min(268px,68vw);aspect-ratio:13/19;margin:10px auto 18px}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.25,.4,1)}
.flipped .flip-in{transform:rotateY(180deg)}
.vface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(46,42,71,.22)}
.vface.vback{border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:radial-gradient(circle,rgba(255,255,255,.2) 0 1.8px,transparent 2.6px) 0 0/18px 18px,#5B4A9E}
.vface.vback span{font:600 24px var(--display)} .vface.vback small{opacity:.85;font-size:14px}
.vface.vfront{transform:rotateY(180deg);background:#FFFDF8;color:#2E2A47;display:flex;flex-direction:column;border:2px solid #2E2A47}
.vband{flex:none;display:flex;align-items:center;gap:10px;padding:14px;border-bottom:2px solid #2E2A47}
.vband b{font:600 30px/1 var(--display)}
.vbody{padding:12px 14px;display:grid;gap:10px;font-size:clamp(13px,3.5vw,15px);line-height:1.4}
.vbody strong{display:block;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Card extras: Moment back and flip */
.card{transition:transform .17s ease-in}
.card.sq{transform:scaleX(0)}
.cbk{display:none;background:radial-gradient(circle,rgba(255,255,255,.17) 0 .09em,transparent .15em) 0 0/1.2em 1.2em,#4D3E8C;color:#fff;border:.14em solid #2E2A47;flex-direction:column;align-items:center;justify-content:center;gap:.45em;text-align:center;padding:1.4em}
.card.showback .front{display:none}
.card.showback .cbk{display:flex}
.cbk .emb{width:3.6em;height:3.6em}
.cbk .wm{font:400 1.2em/1 var(--px)}
.cbk .rule{width:40%;height:.12em;background:rgba(255,255,255,.5);margin:.3em 0}
.cbk .m1{font:400 1.7em/1.1 var(--px2)} .cbk .m2{font:400 1.4em/1.1 var(--px2);opacity:.85}
.cbk .m3{font:400 1.45em/1.15 var(--px2);max-width:13em;word-wrap:break-word;color:#FFE9A8}
.cbk .m4{font:400 1.05em/1 var(--px2);opacity:.7;margin-top:.4em}
.cbk .m6{font:400 1.15em/1.1 var(--px2);opacity:.75}
.cbk .m5{font:400 1.15em/1.15 var(--px2);max-width:14em;opacity:.85;color:#CFE6FF;word-wrap:break-word}
.cbk.dense{gap:.3em;padding:1em;justify-content:safe center;overflow-y:auto}
.cbk.dense .emb,.cbk.dense .wm,.cbk.dense .rule{display:none}
.cbk.dense .m1{font-size:1.45em}.cbk.dense .m2{font-size:1.2em}.cbk.dense .m3{font-size:1.25em}.cbk.dense .m5{font-size:1.05em}.cbk.dense .m6{font-size:1.05em}
.reduce *,.reduce *::before,.reduce *::after{animation:none !important;transition:none !important}

/* Lore, naming, Chronicle */
.field{display:block;width:100%;text-align:left}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;resize:vertical;min-height:52px}
.form{width:100%;max-width:330px;display:grid;gap:10px;text-align:left;margin:0 auto}
.ov .form{max-width:330px}
.ov .field span{color:#D9D2F5}
.ov .field input{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.ov .field input::placeholder{color:#B9B2DA}
.ov .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.ov .ghost{color:#D9D2F5}
.whisper{font-style:italic;color:#CFC2FF;border-left:3px solid #8E78E8;padding:2px 0 2px 10px;max-width:320px;text-align:left;line-height:1.35;font-size:17px}
.speak{font-style:italic;color:#FFE9A8 !important}
.art.hop{animation:hop .34s steps(5,end)}
@keyframes hop{0%{transform:none}40%{transform:translateY(-.7em)}100%{transform:none}}
.chron{display:flex;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.chron .minibtn{background:none;border:0;padding:0;flex:none}
.cbody{min-width:0;flex:1}
.cbody b{font:600 18px var(--display)}
.world{font-style:italic;color:var(--plum);border-left:3px solid var(--plum);padding-left:10px;margin:6px 0;line-height:1.35}
.mine{color:#7A5200;border-left:3px solid #E0A82E;padding:3px 8px 3px 10px;margin:6px 0;background:rgba(255,211,107,.3);border-radius:0 10px 10px 0;line-height:1.35}
.inkw{color:var(--plum);font-style:italic;font-weight:700}
.echo{margin-top:10px;padding-top:12px;border-top:1.5px dashed var(--line)}
.echo .ghost{padding-left:0;margin-top:2px}
.didlist{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.mapwrap{background:var(--mpaper);border:1.5px solid var(--line);border-radius:22px;padding:6px;margin:0 -6px 12px;box-shadow:0 6px 22px rgba(46,42,71,.12)}
.mphit{cursor:pointer;-webkit-tap-highlight-color:transparent}.mphit:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.mp-sel{stroke:var(--plum)}
.mp-paper{fill:var(--mpaper)}.mp-burn{stop-color:var(--mburn)}.mp-fog{fill:var(--mfog)}.mp-grain{fill:var(--mgrain)}.mp-rib{fill:var(--mrib)}.mp-inkf{fill:var(--ink)}.mp-bleed{opacity:var(--mbleed)}
.realmpage{margin-bottom:10px}
.mapsvg{display:block;width:100%;height:auto;max-height:80vh}
.mp-st{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.mp-shade{stroke:var(--plum)}
.mp-faint{stroke:var(--muted);stroke-opacity:.55}
.mp-faint2{fill:var(--muted);fill-opacity:.55;font-family:var(--body);font-style:italic}
.mp-txt{fill:var(--ink);font-family:var(--body);font-style:italic}
.mp-mut{fill:var(--muted);font-family:var(--body);font-style:italic}
.mapcap p{margin:6px 0}
@media (prefers-reduced-motion:no-preference){.mk-ring{transform-box:fill-box;transform-origin:center;animation:mkp 3.2s ease-in-out infinite}}
@keyframes mkp{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.85;transform:scale(1.25)}}
html.reduce .mk-ring{animation:none}
.inkm{color:#8A5A00;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mine{color:#FFE9A8;background:rgba(255,211,107,.12)}:root:not([data-theme="light"]) .inkm{color:#FFD36B}}
.realm,.calling{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--rc,var(--plum));border-radius:14px;padding:12px 14px;margin-bottom:10px}
.realm.locked{border-left-style:dashed}
.realm del{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.realm ins{text-decoration:none;font-style:italic}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scrawl{margin:10px 0 0;padding:2px 0 2px 10px;border-left:2px dashed var(--scr);color:var(--scr);font:italic 500 15px/1.4 var(--body);transform:rotate(-.5deg);transform-origin:left}
.realm b,.calling b{font:600 18px var(--display)}

  {ears:['antenna','pointy'],eyes:['big','round']},{ears:['nubs','pointy'],eyes:['dot','big']},

/* ================= Helpers ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hexRGB=(()=>{const c={};return h=>c[h]||(c[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);})();
function rgbHex(a){return '#'+((1<<24)+(a[0]<<16)+(a[1]<<8)+a[2]).toString(16).slice(1);}
function shade(hex,amt){const q=hexRGB(hex),f=amt<0?0:255,t=Math.abs(amt);return rgbHex(q.map(v=>Math.round((f-v)*t+v)));}
function mix(h1,h2,t){const a=hexRGB(h1),b=hexRGB(h2);return rgbHex(a.map((v,i)=>Math.round(v+(b[i]-v)*t)));}
function hsl(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];}
const RAINBOW=Array.from({length:12},(_,i)=>hsl(i/12,.9,.62));
const GOLD=['#FFF6B8','#FFE066','#FFC93C','#F2A81D','#FFC93C','#FFE066'].map(hexRGB);
const rand=n=>Math.floor(Math.random()*n);
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pad=n=>String(n).padStart(4,'0');
const lerp=(a,b,t)=>Math.round(a+(b-a)*t);

/* ================= Pixel drawing toolkit (32x32 sprite grid) ================= */
const N=32;
const mask=()=>new Uint8Array(N*N);
function setp(m,x,y,fl){x=Math.floor(x);if(fl)x=N-1-x;y=Math.floor(y);if(x>=0&&y>=0&&x<N&&y<N)m[y*N+x]=1;}
function fillEll(m,cx,cy,rx,ry,fl){for(let y=Math.max(0,Math.floor(cy-ry));y<=Math.min(N-1,Math.ceil(cy+ry));y++)for(let x=0;x<N;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)setp(m,x,y,fl);}}
function fillPoly(m,pts,fl){const n=pts.length;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=x+.5,py=y+.5;let ins=false;for(let i=0,j=n-1;i<n;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins;}if(ins)setp(m,x,y,fl);}}
function bez(pts,t){let p=pts.slice();while(p.length>1){const q=[];for(let i=0;i<p.length-1;i++)q.push([p[i][0]+(p[i+1][0]-p[i][0])*t,p[i][1]+(p[i+1][1]-p[i][1])*t]);p=q;}return p[0];}
function curve(m,pts,t0,t1,fl){for(let s=0;s<=48;s++){const t=s/48,p=bez(pts,t),th=t0+(t1-t0)*t,r=th/2;for(let y=Math.max(0,Math.floor(p[1]-r-1));y<=Math.min(N-1,Math.ceil(p[1]+r+1));y++)for(let x=0;x<N;x++){const dx=x+.5-p[0],dy=y+.5-p[1];if(dx*dx+dy*dy<=r*r+.15)setp(m,x,y,fl);}}}
/* Paint a mask into the grid: base fill, shade on the lower-right rim, highlight on the upper-left rim, auto outline */
function commit(g,m,o){
  const inm=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&m[y*N+x]===1;
  const base=o.b||2,sh=o.s===undefined?3:o.s,hl=o.h===undefined?4:o.h;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(!inm(x,y))continue;let s=base;
    if(sh&&(!inm(x+1,y)||!inm(x,y+1)||!inm(x+1,y+1)))s=sh;
    else if(hl&&!inm(x-1,y-1)&&inm(x+1,y)&&inm(x,y+1))s=hl;
    g[y*N+x]=s;
  }
  if(o.out!==false)for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(!inm(x,y)&&(inm(x-1,y)||inm(x+1,y)||inm(x,y-1)||inm(x,y+1)))g[y*N+x]=o.o||1;
  }
}
const CH={o:1,b:2,s:3,h:4,l:5,a:6,w:7,p:8,g:9,G:10,k:11,c:16,t:14,y:17};
function stamp(g,x,y,rows,flipH){rows.forEach((row,j)=>{const r=flipH?row.split('').reverse().join(''):row;for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;const px=x+i,py=y+j;if(px>=0&&py>=0&&px<N&&py<N)g[py*N+px]=CH[ch];}});}
const both=fn=>{fn(false);fn(true);};

/* ================= Creature specification ================= */
const CSH={round:{cy:18,rx:10,ry:9},tall:{cy:16,rx:8,ry:11},wide:{cy:20,rx:12,ry:7},chonk:{cy:17,rx:11,ry:10}};
const DSH={
  hulk:{top:7,poly:[[8,7],[24,7],[28,12],[25,27],[7,27],[4,12]],eyeY:12,gap:2,arm:[3,19],sp:[[5,11],[1,6],[8,9]]},
  wraith:{top:4,poly:[[10,4],[22,4],[26,15],[21,27],[11,27],[6,15]],eyeY:10,gap:2,arm:[7,21],sp:[[8,13],[4,8],[10,11]]},
  beast:{top:9,poly:[[5,17],[10,9],[22,9],[27,17],[24,27],[8,27]],eyeY:14,gap:3,arm:[4,22],sp:[[7,14],[3,10],[10,12]]},
  shard:{top:3,poly:[[16,3],[26,14],[22,27],[10,27],[6,14]],eyeY:12,gap:2,arm:[8,22],sp:[[8,16],[3,12],[10,14]]}
};
function genSpec(c){
  const r=mulberry32(c.seed),rr=mulberry32(c.seed^0x7f4a7c15),pick=a=>a[Math.floor(r()*a.length)];
  const T=THEMES[c.theme],dk=c.dark,P=dk?T.dark:T.cute;
  const s={dark:dk,seed:c.seed,body:pick(P.bodies),flip:r()<.5};
  if(!dk){
    s.shape=pick(['round','tall','wide','chonk']);
    s.ears=r()<.7?pick(BIAS[c.v].ears):pick(['pointy','round','bunny','nubs','antenna','tuft','floppy']);
    s.eyes=r()<.75?pick(BIAS[c.v].eyes):pick(['big','round','dot','sleepy']);
    s.mouth=pick(['smile','cat','open','smile','tiny']);
    s.tail=pick(['curl','fluffy','stub']);
    s.mark=pick(['spots','stripes','none','spots','none']);
  }else{
    s.shape=pick(['hulk','wraith','beast','shard']);
    s.horns=r()<.6?['up','ram','crown'][c.v%3]:pick(['up','ram','crown','none']);
    s.eyes=r()<.6?['glare','slit','hollow','cyclops'][c.v%4]:pick(['glare','slit','hollow','cyclops']);
    s.mouth=pick(['fangs','grin','maw','snarl']);
    s.tail=pick(['spade','scorpion','whip']);
    s.mark=pick(['cracks','runes','ribs','none']);
    s.spines=r()<.5;
  }
  const R=c.rarity;
  s.wings=dk?(rr()<[.2,.35,.55,.85,.7][R]):((R===3&&rr()<.7)||(R===4&&rr()<.55));
  s.third=dk&&R>=2&&rr()<.5;
  s.crown=R===4;s.keep=c.keep||'';
  return s;
}
function makePal(S,c){
  const T=THEMES[c.theme],P=S.dark?T.dark:T.cute,b=S.body,dk=S.dark,p=[];
  p[2]=b;p[3]=mix(shade(b,dk?-.4:-.26),dk?'#2A1A4A':'#5B3E8F',.2);p[4]=shade(b,dk?.22:.34);
  p[1]=dk?mix(shade(b,-.85),'#05040A',.4):shade(b,-.64);
  p[5]=P.belly;p[12]=shade(P.belly,-.2);p[6]=P.accent;p[13]=shade(P.accent,-.28);
  p[7]='#FFFFFF';p[8]=dk?'#0A0810':'#2B2140';p[9]=P.glow||'#FFFFFF';p[10]=P.glow2||'#FFFFFF';
  p[11]=shade(b,dk?-.55:-.42);p[14]=dk?'#E6DEC6':'#FFFFFF';p[15]=dk?'#A89F86':'#D8D0F0';
  p[16]='#FF8FB0';p[17]='#FFD84A';p[18]='#C98A12';
  const out=[[0,0,0]];for(let i=1;i<19;i++)out[i]=hexRGB(p[i]||'#000000');
  const pulse=out.slice();pulse[9]=hexRGB(mix(p[9],p[10],.45));
  return {pal:out,palP:pulse};
}

/* Build one 32x32 frame. bob shifts everything except the feet by one pixel; blink closes the eyes. */
function buildSprite(S,bob,blink){
  const g=new Uint8Array(N*N),oy=bob,fl=S.flip,dk=S.dark;
  const rm=mulberry32(S.seed^0x51ed270b);
  const FOOT=mask(),M=mask();
  let cy,rx,ry,top,eyeY,gap,eh;
  if(!dk){
    const sh=CSH[S.shape];cy=sh.cy+oy;rx=sh.rx;ry=sh.ry;top=cy-ry;
    const tailX=Math.min(16+rx-2,25);
    /* tail */
    const m=mask();
    if(S.tail==='curl')curve(m,[[tailX,cy+3],[tailX+7,cy+4],[tailX+6,cy-5]],3.4,2.2,fl);
    else if(S.tail==='fluffy')fillEll(m,Math.min(tailX+3,28),cy+2,3.6,3.6,fl);
    else fillEll(m,Math.min(tailX+1,29),cy+4,2.4,2.4,fl);
    commit(g,m,S.tail==='fluffy'?{b:5,s:12,h:7}:{});
    /* wings */
    if(S.wings){const w=mask();both(f=>fillEll(w,16-rx-2.5,cy-3,5,3.6,f));commit(g,w,{b:5,s:12,h:7});}
    /* ears */
    const e=mask();let eo={};
    if(S.ears==='pointy')both(f=>fillPoly(e,[[16-rx*.85,top+4],[16-rx*.7,top-6],[16-rx*.2,top+1]],f));
    else if(S.ears==='round')both(f=>fillEll(e,16-rx*.62,top+1.5,3.4,3.4,f));
    else if(S.ears==='bunny')both(f=>fillEll(e,16-rx*.38,top-3,2.6,6.5,f));
    else if(S.ears==='floppy')both(f=>fillEll(e,16-rx-.5,cy-ry*.25,2.6,5,f));
    else if(S.ears==='nubs'){both(f=>fillPoly(e,[[16-rx*.55,top+2],[16-rx*.45,top-3],[16-rx*.2,top+1]],f));eo={b:6,s:13,h:null};}
    else if(S.ears==='antenna'){both(f=>curve(e,[[13,top+2],[11,top-4],[9,top-8]],2,2,f));}
    else if(S.ears==='tuft'){fillEll(e,16,top-2.5,1.8,4);both(f=>fillEll(e,12.5,top-1.5,1.6,3.2,f));eo={b:6,s:13,h:null};}
    commit(g,e,eo);
    if(S.ears==='antenna'){const bl=mask();both(f=>fillEll(bl,9,top-9,2.1,2.1,f));commit(g,bl,{b:6,s:13,h:null});}
    /* feet (not bobbing) */
    both(f=>fillEll(FOOT,16-Math.round(rx*.45),27.5,3.2,2.2,f));commit(g,FOOT,{});
    /* body */
    fillEll(M,16,cy,rx,ry);commit(g,M,{});
    /* belly */
    const bx=16,by=cy+ry*.35,brx=rx*.58,bry=ry*.52;
    const inB=(x,y)=>{const dx=(x+.5-bx)/brx,dy=(y+.5-by)/bry;return dx*dx+dy*dy<=1;};
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(M[y*N+x]&&inB(x,y)&&g[y*N+x]!==1)g[y*N+x]=(!inB(x+1,y)||!inB(x,y+1))?12:5;}
    /* markings */
    if(S.mark==='spots'){for(let i=0;i<3;i++){const sx=16+Math.round((rm()-.5)*rx*1.3),sy=Math.floor(top+3+rm()*ry*.45);for(let a=0;a<2;a++)for(let b=0;b<2;b++){const X=sx+a,Y=sy+b;if(M[Y*N+X]&&g[Y*N+X]!==1&&g[Y*N+X]!==5)g[Y*N+X]=3;}}}
    else if(S.mark==='stripes'){[12,15,16,19].forEach(X=>{for(let Y=top+1;Y<=top+3;Y++){if(M[Y*N+X]&&g[Y*N+X]!==1)g[Y*N+X]=3;}});}
    /* arms */
    const a=mask();both(f=>fillEll(a,16-rx-.5,cy+2,2.1,3,f));commit(g,a,{});
    /* face */
    const gp=Math.max(2,Math.min(5,Math.round(rx*.3)+1));eyeY=Math.round(cy-ry*.22);
    const EY={big:['ppp','wpp','ppp','ppw'],round:['wp','pp','pp'],dot:['wp','pp'],sleepy:['ppp']}[S.eyes];
    const ew=EY[0].length;eh=EY.length;
    const pat=blink&&S.eyes!=='sleepy'?[ 'p'.repeat(ew) ]:EY;
    const ey=blink&&S.eyes!=='sleepy'?eyeY+eh-1:eyeY+(S.eyes==='sleepy'?1:0);
    stamp(g,16-gp-ew,ey,pat,false);stamp(g,16+gp,ey,pat,false);
    stamp(g,16-gp-ew-2,eyeY+eh,['cc'],false);stamp(g,16+gp+ew,eyeY+eh,['cc'],false);
    const MO={smile:['p..p','.pp.'],cat:['p.pp.p','.pppp.'],open:['pppp','.cc.'],tiny:['pp']}[S.mouth];
    stamp(g,16-MO[0].length/2,eyeY+eh+1,MO,false);
    /* crown */
    if(S.crown){const cm=mask();fillPoly(cm,[[12,top-1],[12,top-5],[14,top-3],[16,top-6],[18,top-3],[20,top-5],[20,top-1]]);commit(g,cm,{b:17,s:18,h:null});}
  }else{
    const sh=DSH[S.shape];top=sh.top+oy;eyeY=sh.eyeY+oy;gap=sh.gap;
    /* tail */
    const m=mask();
    if(S.tail==='spade'){curve(m,[[22,25+oy],[29,24+oy],[28,17+oy]],3.2,2,fl);}
    else if(S.tail==='scorpion'){curve(m,[[22,26+oy],[31,22+oy],[29,11+oy],[24,7+oy]],3.4,1.4,fl);}
    else curve(m,[[22,26+oy],[28,29+oy],[30,22+oy],[30,16+oy]],2.4,1.4,fl);
    commit(g,m,{});
    const tipPt=S.tail==='spade'?[28,17+oy]:S.tail==='scorpion'?[24,7+oy]:[30,16+oy];
    const tm=mask();fillEll(tm,tipPt[0],tipPt[1]-.5,S.tail==='spade'?2.8:1.6,S.tail==='spade'?2.8:1.6,fl);commit(g,tm,{b:6,s:13,h:null});
    /* wings */
    if(S.wings){const w=mask(),t=top;both(f=>fillPoly(w,[[12,t+7],[2,t-2],[1,t+6],[4,t+5],[3,t+11],[6,t+9],[6,t+16],[10,t+12],[12,t+14]],f));commit(g,w,{b:11,s:3,h:3});}
    /* horns */
    const hm=mask();
    if(S.horns==='up')both(f=>curve(hm,[[11,top+3],[8,top-2],[9,top-8]],3.4,1.2,f));
    else if(S.horns==='ram')both(f=>curve(hm,[[11,top+4],[4,top],[3,top+7]],3.6,1.4,f));
    else if(S.horns==='crown'){[[11,4],[16,6],[21,4]].forEach(p=>fillPoly(hm,[[p[0]-2.2,top+2],[p[0],top-p[1]+2],[p[0]+2.2,top+2]]));}
    commit(g,hm,{b:14,s:15,h:null});
    /* shoulder spines */
    if(S.spines){const sp=mask();both(f=>fillPoly(sp,sh.sp.map(p=>[p[0],p[1]+oy]),f));commit(g,sp,{b:14,s:15,h:null});}
    /* feet */
    both(f=>fillEll(FOOT,16-6,27.5,3.4,2,f));commit(g,FOOT,{});
    for(const X of [8,10,21,23])g[29*N+X]=14;
    /* body */
    fillPoly(M,sh.poly.map(p=>[p[0],p[1]+oy]));commit(g,M,{});
    /* chest */
    const cb=mask();fillEll(cb,16,top+(27-sh.top)*.62,4.2,5.2);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(cb[y*N+x]&&M[y*N+x]&&g[y*N+x]!==1)g[y*N+x]=5;
    /* markings */
    if(S.mark==='ribs'){for(let k=0;k<3;k++){const Y=Math.floor(top+(27-sh.top)*.5)+k*2;for(let X=14;X<=17;X++)if(M[Y*N+X]&&g[Y*N+X]===5)g[Y*N+X]=11;}}
    else if(S.mark==='cracks'){let X=11,Y=top+2;for(let k=0;k<9;k++){if(M[Y*N+X]&&g[Y*N+X]!==1)g[Y*N+X]=11;Y++;X+=(k%2?1:-1)*(rm()<.5?0:1)+(k%3===0?1:0);}}
    else if(S.mark==='runes'){[[15,top+11],[16,top+11],[15,top+12],[16,top+13],[15,top+14]].forEach(p=>{if(M[p[1]*N+p[0]])g[p[1]*N+p[0]]=6;});}
    /* arms and claws */
    const am=mask();both(f=>fillEll(am,sh.arm[0],sh.arm[1]+oy,2.6,4.8,f));commit(g,am,{});
    for(const sd of [0,1]){const ax=sd?N-1-Math.floor(sh.arm[0]):Math.floor(sh.arm[0]),by=Math.floor(sh.arm[1]+oy+4.8)+1;for(let i=-1;i<=1;i++){const X=ax+i,Y=by;if(X>=0&&X<N&&Y<N)g[Y*N+X]=14;}}
    /* face */
    const gx=gap,ey=eyeY;
    if(S.eyes==='glare'){const L=blink?['gggg']:['gg..','.ggG'],Rr=blink?['gggg']:['..gg','Ggg.'];eh=blink?1:2;stamp(g,16-gx-4,ey+(blink?1:0),L,false);stamp(g,16+gx,ey+(blink?1:0),Rr,false);}
    else if(S.eyes==='slit'){const L=blink?['ggg']:['gpg','gpg','gpg'];eh=blink?1:3;stamp(g,16-gx-3,ey+(blink?1:0),L,false);stamp(g,16+gx,ey+(blink?1:0),L,false);}
    else if(S.eyes==='hollow'){const L=blink?['www']:['www','wpw','www'];eh=blink?1:3;stamp(g,16-gx-3,ey+(blink?1:0),L,false);stamp(g,16+gx,ey+(blink?1:0),L,false);}
    else{const L=blink?['gggggg']:['.gggg.','ggppgg','.gggg.'];eh=blink?1:3;stamp(g,13,ey+(blink?1:0),L,false);}
    if(S.third&&!blink)stamp(g,15,ey-4,['gg','gG'],false);
    const MO={fangs:['pppppp','t.pp.t'],grin:['pppppppp','ptptptpt'],maw:['.pppppp.','pptpptpp','.pppppp.'],snarl:['pppp','tppt']}[S.mouth];
    stamp(g,16-MO[0].length/2,ey+eh+2,MO,false);
    /* halo for legends */
    if(S.crown){const hmk=mask();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(x+.5-16)/6.5,dy=(y+.5-(top-3))/2;const d=dx*dx+dy*dy;if(d>=.62&&d<=1.1)setp(hmk,x,y,false);}
      for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(hmk[y*N+x])g[y*N+x]=17;}
  }

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function buildScene(c,rb){
  const W=48,H=37,T=THEMES[c.theme],dk=c.dark,P=dk?T.dark:T.cute,GY=31;
  const rgb=new Uint8Array(W*H*3),foil=new Uint8Array(W*H);
  const put=(x,y,col,f)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;const q=typeof col==='string'?hexRGB(col):col,i=y*W+x;rgb[i*3]=q[0];rgb[i*3+1]=q[1];rgb[i*3+2]=q[2];foil[i]=f?1:0;};
  const rect=(x0,y0,x1,y1,col)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)put(x,y,col);};
  const ell=(cx,cy,rx,ry,col)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)put(x,y,col);}};
  const poly=(pts,col)=>{const n=pts.length;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=x+.5,py=y+.5;let ins=false;for(let i=0,j=n-1;i<n;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins;}if(ins)put(x,y,col);}};
  if(c.rarity===4){
    const base=dk?P.sky[0]:mix(P.accent,'#0E0B1E',.84),midc=mix(P.accent,'#0E0B1E',dk?.66:.6),c0=hexRGB(base),c1=hexRGB(midc);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dd=Math.hypot((x+.5-24)/24,(y+.5-17)/20),f=Math.max(0,1-dd)*5;let bi=Math.floor(f);if(f-bi>(BAY[(y&3)*4+(x&3)]+.5)/16)bi++;const t=Math.min(1,bi/5)*.9;put(x,y,[lerp(c0[0],c1[0],t),lerp(c0[1],c1[1],t),lerp(c0[2],c1[2],t)],false);}
    const gcol=hexRGB(mix(P.ground[1],'#0E0B1E',.55)),gtop=hexRGB(mix(P.ground[0],'#0E0B1E',.4));
    for(let y=GY;y<H;y++)for(let x=0;x<W;x++)put(x,y,y===GY?gtop:gcol,false);
    const shd=shade(rgbHex(gcol),-.4);for(let x=14;x<=34;x++)put(x,34,shd);for(let x=17;x<=31;x++)put(x,35,shd);
    return {rgb,foil};
  }
  const s0=hexRGB(P.sky[0]),s1=hexRGB(P.sky[1]),NB=6;
  for(let y=0;y<GY;y++)for(let x=0;x<W;x++){const f=y/GY*NB;let bi=Math.floor(f);if(f-bi>(BAY[(y&3)*4+(x&3)]+.5)/16)bi++;const t=Math.min(1,bi/NB);put(x,y,[lerp(s0[0],s1[0],t),lerp(s0[1],s1[1],t),lerp(s0[2],s1[2],t)],true);}
  const R=()=>rb();
  const hills=(col,base,amp,fq,ph)=>{for(let x=0;x<W;x++){const h=Math.round(base+amp*Math.sin(x*fq+ph));for(let y=h;y<GY;y++)put(x,y,col);}};
  const id=T.id;

    else if(id==='ember'){poly([[30,GY],[36,15],[41,15],[47,GY]],'#8A5240');rect(37,15,40,15,'#FF9A3D');ell(39,11,3,2,'#F0D0C0');ell(42,8,2.5,1.8,'#E8C4B4');for(let i=0;i<9;i++)put(R()*W,R()*GY,'#FFE08A');hills('#B8725A',GY-3,1.5,.35,0);}
    else if(id==='tide'){for(let i=0;i<9;i++){const x=R()*W,y=3+R()*24;put(x,y,'#EAFBFF');put(x+1,y,'#BFE9F8');}for(const x of [5,12,38,44])for(let y=GY-9;y<GY;y++)put(x+Math.round(Math.sin(y*.7+x)),y,'#3FA57A');}
    else if(id==='frost'){poly([[0,GY],[10,14],[18,GY]],'#B7CDE8');poly([[14,GY],[26,10],[38,GY]],'#C9DAF0');poly([[30,GY],[40,16],[48,GY]],'#B7CDE8');put(26,10,'#fff');put(25,11,'#fff');put(27,11,'#fff');put(10,14,'#fff');put(40,16,'#fff');for(let i=0;i<18;i++)put(R()*W,R()*GY,'#FFFFFF');}
    else{for(let i=0;i<16;i++)put(R()*W,R()*16,'#FFFFFF');ell(36,9,6,6,'#FFF1C9');put(34,8,'#EADBB0');put(37,11,'#EADBB0');hills('#5A4A9A',GY-6,3,.2,0);}
  }else{
    if(id==='meadow'){ell(37,8,4.4,4.4,'#D8D2B8');put(36,7,'#B8B198');put(38,9,'#B8B198');for(const tx of [6,14,34,43]){rect(tx,15,tx+1,GY-1,'#0B1210');for(let k=0;k<4;k++){put(tx-1-k,20-k,'#0B1210');put(tx+2+k,18-k,'#0B1210');}}for(let y=GY-4;y<GY;y++)for(let x=0;x<W;x++)if((x+y)&1)put(x,y,'#35493A');put(9,GY-5,P.glow);put(11,GY-5,P.glow);put(40,GY-6,P.glow);put(42,GY-6,P.glow);}
    else if(id==='ember'){poly([[18,GY],[30,9],[38,9],[48,GY]],'#1D0E12');ell(34,9,5,1.6,'#FF8A2E');for(const k of [-3,0,3])for(let y=10;y<GY;y++)put(34+k+Math.round(Math.sin(y*.5+k)),y,'#FF6A2A');ell(34,5,6,2,'#3A1E22');for(let i=0;i<14;i++)put(R()*W,R()*GY,'#FF9A4A');}
    else if(id==='tide'){poly([[8,0],[14,0],[26,GY],[16,GY]],'#0B3350');for(let i=0;i<12;i++)put(R()*W,R()*GY,P.glow);ell(14,10,1.6,1.6,P.glow);for(let k=0;k<5;k++)put(10+k*.8,14-k*.8,'#1B4F6A');for(const x of [20,22,30])put(x,GY-1,'#CFC9B8');}
    else if(id==='frost'){for(let x=0;x<W;x++)for(let k=0;k<7;k++){const y=5+Math.round(4*Math.sin(x*.2+k*.3))+k;if((x+k)&1)put(x,y,k<4?'#3DF0C0':'#C94FD6',true);}for(let i=0;i<14;i++)put(R()*W,R()*GY,'#CFE6FF');poly([[0,GY],[6,18],[10,GY]],'#2A3A5C');poly([[36,GY],[42,16],[48,GY]],'#2A3A5C');}
    else{ell(34,11,7.5,7.5,'#C22A4A');put(32,9,'#8A1B36');put(36,13,'#8A1B36');put(33,14,'#8A1B36');poly([[0,GY],[8,20],[14,GY]],'#0B0618');poly([[30,GY],[40,18],[48,GY]],'#0B0618');for(const b of [[8,8],[16,13],[26,6]]){put(b[0],b[1],'#05030A');put(b[0]+1,b[1]+1,'#05030A');put(b[0]+2,b[1],'#05030A');put(b[0]+3,b[1]+1,'#05030A');put(b[0]+4,b[1],'#05030A');}for(let i=0;i<9;i++)put(R()*W,R()*14,'#C9B8FF');}
  }
  const g0=hexRGB(P.ground[0]),g1=hexRGB(P.ground[1]);
  for(let y=GY;y<H;y++)for(let x=0;x<W;x++){const d=y-GY;put(x,y,d<2?g0:(d<4&&((x+y)&1))?g0:g1);}
  if(!dk&&id==='meadow')for(let i=0;i<8;i++)put(R()*W,GY+1+R()*4,['#FFFFFF','#FFD36B','#F59AB5'][i%3]);
  if(dk&&id==='ember')for(let i=0;i<7;i++){const x=R()*W;put(x,GY+1+R()*4,'#FF7A2E');}

  const sh=shade(rgbHex(g1),-.35);for(let x=14;x<=34;x++)put(x,34,sh);for(let x=17;x<=31;x++)put(x,35,sh);

}

const PREP={},CMAP={};
const ckey=c=>c.seed+'-'+c.rarity+'-'+(c.dark?1:0)+'-'+c.theme+'-'+(c.keep||'')+(c.bond>=25?'f':'');
function prep(c){
  const k=ckey(c);if(PREP[k])return PREP[k];
  const spec=genSpec(c),pl=makePal(spec,c),rb=mulberry32(c.seed^0x5bd1e995),scene=buildScene(c,rb),sparks=[];
  const n=[0,3,5,9,7][c.rarity];for(let i=0;i<n;i++){let sx=Math.floor(rb()*48),sy=Math.floor(rb()*34);if(c.rarity===4){const a=rb()*Math.PI*2,q=14+rb()*5;sx=Math.max(1,Math.min(46,Math.floor(24+Math.cos(a)*q*1.25)));sy=Math.max(1,Math.min(33,Math.floor(19+Math.sin(a)*q*.85)));}sparks.push({x:sx,y:sy,per:700+rb()*900,ph:rb(),big:rb()<.35});}
  return PREP[k]={c,spec,pal:pl.pal,palP:pl.palP,scene,sp:[null,null,null,null],sparks,img:null};
}
const FOIL3={4:1,6:1,9:1,10:1,17:1},FOIL4={1:1,17:1};
function drawFrame(e,cv,t,ph){
  const c=e.c,R=c.rarity,W=48,H=37,ctx=cv.getContext('2d');
  if(!e.img)e.img=ctx.createImageData(W,H);
  const d=e.img.data,to=t+(c.seed%2000);
  const bob=Math.floor(to/520)%2,blink=(to%3600)<140?1:0,pulse=Math.floor(to/640)%2;
  const si=bob*2+blink;if(!e.sp[si])e.sp[si]=buildSprite(e.spec,bob,blink);
  const g=e.sp[si],pal=pulse?e.palP:e.pal,bg=e.scene.rgb,bf=e.scene.foil;
  const hov=ph!=null,hue=to/1100+(hov?ph*.9:0),sheen=hov?ph*70:((to/50)%95)-10,Rr=16+Math.sin(to/450)*1.3;
  const FS=R===3?FOIL3:R===4?FOIL4:null,OX=8,OY=4;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x,sx=x-OX,sy=y-OY;let slot=0;
    if(sx>=0&&sx<32&&sy>=0&&sy<32)slot=g[sy*32+sx];
    let r,gg,b,foil=false;

    else{const j=i*3;r=bg[j];gg=bg[j+1];b=bg[j+2];foil=!!(bf[i]&&R>=3);
      if(R===4){const dd=Math.hypot(x+.5-24,y+.5-19);if(Math.abs(dd-Rr)<.7){r=226;gg=186;b=72;}}}
    if(foil){
      if(R===3){const q=RAINBOW[Math.floor((((x+y)*.045+hue)%1)*12)%12],k=slot?.7:(c.dark?.3:.5);r=lerp(r,q[0],k);gg=lerp(gg,q[1],k);b=lerp(b,q[2],k);}
      else{const q=GOLD[Math.floor((((x+y)*.05+hue*1.2)%1)*6)%6],k=slot?.85:.3;r=lerp(r,q[0],k);gg=lerp(gg,q[1],k);b=lerp(b,q[2],k);}
    }
    if(R>=2&&(R<4||hov)&&Math.abs(x+y*.7-sheen)<2.2){r=lerp(r,255,.42);gg=lerp(gg,255,.42);b=lerp(b,255,.42);}
    const o=i*4;d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=255;
  }
  const wp=(x,y,cr)=>{if(x<0||y<0||x>=W||y>=H)return;const o=(y*W+x)*4;d[o]=cr[0];d[o+1]=cr[1];d[o+2]=cr[2];};

  e.sparks.forEach(s=>{const p=((to/s.per)+s.ph)%1;if(p<.3){wp(s.x,s.y,SC);if(p>.08&&p<.22){const L=s.big?2:1;for(let k=1;k<=L;k++){wp(s.x-k,s.y,SC);wp(s.x+k,s.y,SC);wp(s.x,s.y-k,SC);wp(s.x,s.y+k,SC);}}}});

}

}

function realmText(key,cards){
  let x=REALM_PAGES[key].x,h=esc(x);
  const rev=REALM_REV[key];if(!rev||!cards.length)return h;
  const first=Math.min.apply(null,cards.map(c=>dnum(c.date))),age=dnum(todayKey())-first;
  let stage=0;REV_AT.forEach((t,i)=>{if(age>=t)stage=i+1;});
  for(let i=0;i<stage;i++){
    const o=esc(rev[i][0]),n=esc(rev[i][1]);
    if(h.indexOf(o)<0)continue;
    if(i<stage-1){h=h.replace(o,n);continue;}
    const ow=o.split(' '),nw=n.split(' ');let k=0;while(k<ow.length&&k<nw.length&&ow[k]===nw[k])k++;k=Math.max(0,k-1);
    const pre=ow.slice(0,k).join(' ')+(k?' ':'');
    h=h.replace(o,pre+`<del>${ow.slice(k).join(' ')}</del><span class="sr"> (crossed out) </span> <ins>${nw.slice(k).join(' ')}</ins>`);
  }
  return h;
}

const PETAL=[[255,214,90],[245,150,190],[170,140,235],[255,130,100]];
function drawSprout(setpx,t){
  const q=state.hearth.quiet;if(!q)return;const st=quietStage(q.g);if(!st)return;
  const X=100,Y=70,sw=Math.round(Math.sin(t/900)*.6),H=[0,2,5,8,10,11][st],sx=k=>X+(k>H-3?sw:0);

  for(let k=1;k<=H;k++)setpx(sx(k),Y-k,stem);

  if(st>=3){setpx(X-2,Y-4,leaf);setpx(X-1,Y-4,leaf);setpx(X+1,Y-5,leaf);setpx(X+2,Y-5,leaf);}

  if(st===4){for(let a=-1;a<=1;a++)for(let b=0;b<3;b++)setpx(tx+a,ty-1-b,[pc[0]*.85,pc[1]*.85,pc[2]*.85]);setpx(tx,ty-3,[255,246,200]);}
  if(st===5){
    const cy=ty-3,ctr=(q.v||0)===0?[240,150,60]:[255,228,120];

}

/* The oldest daily card whose anniversary is today. Pack finds are not tied to a day's calling, so they do not echo. */
function echoFor(k){
  let best=null;
  for(const c of state.cards){
    if(!c||c.source!=='daily'||typeof c.date!=='string'||c.date>=k)continue;
    const age=dayDiff(c.date,k);if(!(age>=KEPT_DAYS))continue;
    let lab=null;
    if(age===KEPT_DAYS)lab='Two weeks ago today';
    for(const m of ECHO_M)if(addMonths(c.date,m)===k)lab=m===1?'A month ago today':m+' months ago today';
    for(let y=1;y<=20;y++)if(addMonths(c.date,12*y)===k){lab=y===1?'A year ago today':y+' years ago today';break;}

function biq(x,type,fc,Q,sr){

/* A 12 second, seamless loop of fire, plus (optionally) natural sounds that match the backdrop.
   Everything is shaped noise, so there are no pure tones to sound like beeps. */
const AMB_SR=22050,AMB_SECS=12;
function bakeAmb(kind,nature,seed){
  const sr=AMB_SR,secs=AMB_SECS,xf=Math.floor(.4*sr),L=secs*sr,N=L+xf,r=mulberry32(seed);
  const noise=n=>{const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=r()*2-1;return a;};
  const rmsOf=x=>{let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];return Math.sqrt(s/x.length)||1;};
  const out=new Float32Array(N);
  const layer=(x,target,mod)=>{const k=target/rmsOf(x);for(let i=0;i<N;i++)out[i]+=x[i]*k*(mod?mod(i/sr):1);};
  const swell=(rate,ph)=>t=>{const v=.5+.5*Math.sin(2*Math.PI*rate*t+ph);return .25+.75*v*v;};
  const burst=(at,len,type,fc,Q,amp,decay)=>{const nz=biq(noise(len),type,fc,Q,sr),k=1/rmsOf(nz);for(let i=0;i<len&&at+i<N;i++)out[at+i]+=nz[i]*k*amp*Math.exp(-decay*i/len);};
  /* the fire: a warm bed, a low body, then ticks, crackles and the odd pop */
  layer(biq(biq(noise(N),'bp',380,.7,sr),'lp',1100,.7,sr),.085,t=>1+.3*Math.sin(2*Math.PI*.37*t)+.15*Math.sin(2*Math.PI*.91*t+1));
  layer(biq(noise(N),'lp',110,.7,sr),.045,t=>1+.4*Math.sin(2*Math.PI*.23*t));
  for(let q=0;q<secs*10;q++)burst(Math.floor(r()*(L-1000)),Math.floor((.004+r()*.006)*sr),'hp',4500+r()*3000,.7,.05+r()*.07,5);
  for(let q=0;q<secs*5;q++)burst(Math.floor(r()*(L-3000)),Math.floor((.012+r()*.025)*sr),'hp',2000+r()*2500,.7,.1+r()*.12,6);
  for(let q=0;q<Math.floor(secs*.7);q++)burst(Math.floor(r()*(L-4000)),Math.floor((.03+r()*.03)*sr),'bp',700+r()*600,1.2,.25+r()*.15,5);
  /* nature */
  if(nature){
    if(kind==='crickets'){
      layer(biq(noise(N),'bp',650,.8,sr),.012,swell(.06,1));                       /* a faint night breeze */
      [[4300,18,26,.03],[5100,20,31,.024],[3700,15,23,.02]].forEach((b,j)=>{        /* a far-off chorus */
        const band=biq(noise(N),'bp',b[0],b[1],sr),gate=new Float32Array(N);let g=0,tgt=1,next=0;
        for(let i=0;i<N;i++){if(i>=next){tgt=r()<.65?1:.12;next=i+Math.floor((1+r()*2.2)*sr);}g+=(tgt-g)*.0005;gate[i]=g;}
        const k=b[3]/rmsOf(band);
        for(let i=0;i<N;i++){const t=i/sr,tr=.5+.5*Math.sin(2*Math.PI*(b[2]+2*Math.sin(2*Math.PI*.3*t+j))*t);out[i]+=band[i]*k*gate[i]*(.2+.8*tr*tr);}
      });
      for(let c=0;c<3;c++){                                                         /* a few nearer crickets, never quite regular */
        const fc=4000+r()*800;
        for(let t=.5+r()*1.5;t<secs-.8;t+=.8+r()*1.3){
          const pulses=3+Math.floor(r()*3);
          for(let p=0;p<pulses;p++){const at=Math.floor((t+p*(.032+r()*.014))*sr),len=Math.floor(.013*sr);
            const nz=biq(noise(len),'bp',fc*(1+(r()-.5)*.04),22,sr),k=1/rmsOf(nz),amp=.05+r()*.04;
            for(let i=0;i<len;i++)out[at+i]+=nz[i]*k*amp*Math.sin(Math.PI*i/len);}
        }
      }
    }
    if(kind==='birds'){
      layer(biq(biq(noise(N),'bp',1400,.6,sr),'lp',3200,.7,sr),.03,swell(.09,.5));  /* breeze through leaves */
      layer(biq(noise(N),'bp',4500,.5,sr),.008,swell(.13,2));
      for(let t=2+r()*3;t<secs-1;t+=5+r()*6){                                       /* a rare, soft bird phrase */
        const notes=2+Math.floor(r()*3),base=2500+r()*1200;let at=t;
        for(let n=0;n<notes;n++){
          const len=Math.floor((.06+r()*.07)*sr),a0=Math.floor(at*sr),glide=.8+r()*.5,vib=24+r()*16;let ph=0;
          for(let i=0;i<len&&a0+i<N;i++){const u=i/len,f=base*Math.pow(glide,u)*(1+.02*Math.sin(2*Math.PI*vib*i/sr));ph+=2*Math.PI*f/sr;
            const env=Math.min(1,i/(.008*sr))*Math.exp(-3.2*u);out[a0+i]+=(Math.sin(ph)+.3*Math.sin(2*ph))*env*.04;}
          at+=(len/sr)+.05+r()*.1;
        }
      }
    }
    if(kind==='wind'){
      layer(biq(noise(N),'bp',350,1.2,sr),.07,swell(.05,0));
      layer(biq(noise(N),'bp',950,1.5,sr),.04,swell(.083,2));
      layer(biq(noise(N),'lp',90,.7,sr),.04);
    }
    if(kind==='cave'){
      layer(biq(noise(N),'lp',100,.7,sr),.07);
      layer(biq(noise(N),'bp',2500,.5,sr),.006);
      for(let t=1+r()*2;t<secs-.6;t+=3.5+r()*3.5){
        [[0,1],[.14,.35]].forEach(d=>{const at=Math.floor((t+d[0])*sr),len=Math.floor(.12*sr),f0=950+r()*300;let ph=0;
          for(let i=0;i<len&&at+i<N;i++){const u=i/len;ph+=2*Math.PI*f0*(1+.25*u)/sr;out[at+i]+=Math.sin(ph)*Math.exp(-9*u)*.1*d[1];}
          burst(at,Math.floor(.004*sr),'bp',1500,6,.06*d[1],3);});
      }
    }
  }
  for(let i=0;i<xf;i++){const w=i/xf;out[i]=out[i]*w+out[L+i]*(1-w);}   /* make the loop seamless */
  return normTo(out.slice(0,L),.8);
}
function bakePoke(){
  const sr=AMB_SR,N=Math.floor(.7*sr),r=mulberry32(7),out=new Float32Array(N);

  for(let q=0;q<9;q++){const at=Math.floor(r()*.45*sr),big=q%3===0,len=Math.floor((big?.05:.015+r()*.02)*sr),nz=biq(noise(len),big?'bp':'hp',big?900:2200+r()*3000,big?1.2:.7,sr);

function mediaAmbKind(){const bd=curBd(),mode=todMode();return bd==='snow'?'wind':bd==='cave'?'cave':(bd==='glade'||(!bd&&mode==='day'))?'birds':'crickets';}

/* ----- Making sure phones let the standard engine play ----- */
function silentWav(){
  const n=2000,u=new Uint8Array(44+n),dv=new DataView(u.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)u[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);

}
function auPrime(){
  if(eng()==='media')return;

  try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}
  if(!AU.keep&&/iP(hone|ad|od)/.test(navigator.userAgent||'')&&!navigator.audioSession){
    try{const a=document.createElement('audio');a.src=silentWav();a.loop=true;a.setAttribute('playsinline','');AU.keep=a;const p=a.play();if(p&&p.catch)p.catch(()=>{AU.keep=null;});}catch(e){}
  }
  const done=()=>{
    if(!AU.primed&&c.state==='running'){AU.primed=true;try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}
    audioSync();auStatus();
  };
  if(c.state!=='running')c.resume().then(done).catch(done);else if(!AU.primed)done();

/* ----- Soft music (standard engine only): a slow, generative lullaby in A minor pentatonic. Off by default. ----- */
const MUS={tempo:76,scale:[220,261.63,293.66,329.63,392,440,523.25,587.33],chords:[[110,220,261.63,329.63],[87.31,174.61,220,261.63],[130.81,261.63,329.63,392],[98,196,246.94,293.66]]};
function toneAt(f,t,dur,gain,type,dest){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
function padAt(f,t,dur,dest){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.045,t+1.2);g.gain.linearRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
function musStart(){
  const c=auInit();if(!c||AU.musRun)return;
  const dly=c.createDelay(1),fb=c.createGain(),wet=c.createGain(),lp=c.createBiquadFilter();
  dly.delayTime.value=.34;fb.gain.value=.34;wet.gain.value=.35;lp.type='lowpass';lp.frequency.value=2200;
  dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(AU.mus);lp.connect(AU.mus);lp.connect(dly);
  const run={next:c.currentTime+.15,step:0,lp,timer:null};
  run.timer=setInterval(()=>musTick(run),60);AU.musRun=run;
}
function musTick(run){
  const c=AU.ctx;if(!c||AU.musRun!==run||c.state!=='running')return;const spb=60/MUS.tempo/2;
  while(run.next<c.currentTime+.3){
    const t=run.next,s=run.step,ci=Math.floor(s/16)%MUS.chords.length,ch=MUS.chords[ci];
    if(s%16===0)ch.slice(1).forEach((f,i)=>padAt(f*(i%2?1.003:.997),t,spb*16,run.lp));
    if(s%4===0)toneAt(ch[0],t,.5,.17,'triangle',run.lp);
    if(Math.random()<.5)toneAt(MUS.scale[rand(MUS.scale.length)]*(Math.random()<.25?2:1),t,.35,.11,'square',run.lp);
    run.next+=spb;run.step++;
  }
}
function musStop(){const r=AU.musRun;if(!r)return;AU.musRun=null;clearInterval(r.timer);}

function audioSync(){
  if(!state||!state.ageBand)return;

  mediaAmbStop();

  if(wantAmb){if(AU.ambRun&&AU.ambRun.key!==ambKey())ambStop();if(!AU.ambRun)ambStart();}else if(AU.ambRun)ambStop();
  const wantMus=sOn()&&state.settings.music!==false;
  if(wantMus&&!AU.musRun)musStart();else if(!wantMus&&AU.musRun)musStop();
}

function downloadBlob(blob,name){try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;}catch(e){toast('Saving did not work here. Try copying the text instead.');return false;}}
function backupFile(){

  let f=null;try{f=new File([blob],name,{type:'application/json'});}catch(e){}

let shareCv=null;
async function shareFonts(){try{await Promise.race([Promise.all(['600 52px Fredoka','400 28px "Nunito Sans"','22px "Press Start 2P"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,1500))]);}catch(e){}}
function shareCanvas(c){
  const W=720,H=960,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),R=RAR[c.rarity],nm=c.nick||c.name;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1B1430');g.addColorStop(1,'#35223C');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=R.edge;x.fillRect(0,0,W,14);x.fillRect(0,H-14,W,14);x.fillRect(0,0,14,H);x.fillRect(W-14,0,14,H);
  x.fillStyle=R.glow;x.fillRect(14,14,W-28,4);x.fillRect(14,14,4,H-28);
  x.fillStyle='#E2B04A';[[22,22],[W-38,22],[22,H-38],[W-38,H-38]].forEach(p=>x.fillRect(p[0],p[1],16,16));
  const src=document.createElement('canvas');src.width=48;src.height=37;drawFrame(prep(c),src,300-(Math.abs(c.seed|0)%2000),null);
  x.fillStyle=R.edge;x.fillRect(64,74,592,460);x.fillStyle=R.glow;x.fillRect(68,78,584,452);
  x.imageSmoothingEnabled=false;x.drawImage(src,72,82,576,444);
  const fit=(t,max,size,w,fam)=>{let s=size;do{x.font=`${w} ${s}px ${fam}`;s-=2;}while(x.measureText(t).width>max&&s>14);};
  const wrap=(t,max)=>{const words=t.split(' '),out=[];let line='';words.forEach(wd=>{const tr=line?line+' '+wd:wd;if(x.measureText(tr).width>max&&line){out.push(line);line=wd;}else line=tr;});if(line)out.push(line);return out;};
  x.textAlign='center';x.textBaseline='alphabetic';let y=604;
  x.fillStyle='#FFF3D6';fit(nm,600,54,600,'Fredoka, sans-serif');x.fillText(nm,W/2,y);
  if(c.nick&&c.nick!==c.name){y+=40;x.fillStyle='#CDBFDB';fit(c.name,600,26,400,'"Nunito Sans", sans-serif');x.fillText(c.name,W/2,y);}
  y+=46;x.fillStyle=R.glow;fit(`${R.name} · ${realmName(c)}`,600,28,600,'"Nunito Sans", sans-serif');x.fillText(`${R.name} · ${realmName(c)}`,W/2,y);
  const found=c.source==='pack'?'Found in a pack, earned by showing up.':(DID[c.v]?`Found the day I'd ${DID[c.v]}.`:'Found by showing up.');
  x.fillStyle='#EDE3F2';x.font='400 27px "Nunito Sans", sans-serif';wrap(found,600).slice(0,3).forEach(l=>{y+=40;x.fillText(l,W/2,y);});
  let when='';try{when=new Date(c.date+'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});}catch(e){}
  if(when){y+=38;x.fillStyle='#B9A9C9';x.font='400 22px "Nunito Sans", sans-serif';x.fillText(when,W/2,y);}
  x.fillStyle='#FFD36B';x.font='22px "Press Start 2P", monospace';x.fillText('FORGE',W/2,H-72);
  x.fillStyle='#B9A9C9';x.font='400 20px "Nunito Sans", sans-serif';x.fillText('Every Forgeling is one of a kind',W/2,H-40);
  return cv;
}
async function openShare(id){
  const c=cardById(id);if(!c)return;await shareFonts();
  const cv=shareCanvas(c),url=cv.toDataURL('image/png'),blob=await new Promise(r=>{try{cv.toBlob(r,'image/png');}catch(e){r(null);}});
  shareCv={c,cv,blob};const can=canShareFiles(),nm=c.nick||c.name;
  ovMode='share';
  openOverlay(`<p class="rv-title">Share ${esc(nm)}</p><img class="shareimg" id="shareImg" src="${url}" alt="A picture card of ${esc(nm)}, ${RAR[c.rarity].name}, from ${esc(realmName(c))}">
    <p class="rv-hint">${can?'Send it to a friend, or save it to your photos.':'Save the picture, then send it however you like.'} It's made on this phone, and nothing is uploaded.</p>
    <div class="btnrow"><button class="primary" id="shDo">${can?'Share':'Save picture'}</button><button class="ghost" id="shBack" data-cid="${c.id}">Back</button></div>`,true);
  ovMode='share';const d=$('#shDo');if(d)d.focus({preventScroll:true});
}
function doShare(){
  const s=shareCv;if(!s)return;if(!s.blob){toast('That picture could not be made here.');return;}
  const nm=s.c.nick||s.c.name,name=(nm.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'forgeling')+'.png';
  if(NATIVE&&PL.Share&&PL.Filesystem){nshareFile(s.blob,name,nm).then(()=>toast('Shared.')).catch(err=>{if(!/cancel/i.test(String(err&&err.message||err)))toast('That picture could not be shared here.');});return;}
  let f=null;try{f=new File([s.blob],name,{type:'image/png'});}catch(e){}
  if(f&&canShareFiles()){navigator.share({files:[f],title:nm}).then(()=>toast('Shared.')).catch(err=>{if(err&&err.name==='AbortError')return;if(downloadBlob(s.blob,name))toast('Picture saved.');});return;}
  if(downloadBlob(s.blob,name))toast('Picture saved.');
}

/* ---- The living sky: the app's background follows the real time of day, drawn at pixel-art resolution ---- */
/* s = sky top and horizon, h = far and near hills, st = star colour (none by day), orb = sun or moon */
const SKY={
  light:{dawn:{s:['#F5E2EC','#FCEBDD'],h:['#EBCBD9','#DDB7CC'],st:null,orb:null},
         day:{s:['#DCEFFA','#EFF8EA'],h:['#CDE6C3','#B8DBAE'],st:null,orb:'#FFF3BF'},
         dusk:{s:['#E6DCF6','#F9DDE6'],h:['#D8C4E8','#C5B0DC'],st:'#FFFFFF',orb:null},
         night:{s:['#D8D9F1','#EAE6F8'],h:['#CBC5E8','#B8B1DD'],st:'#FFFFFF',orb:'#FFFFFF'}},
  dark:{dawn:{s:['#1C1630','#4E2944'],h:['#33213D','#271A32'],st:'#A9849F',orb:null},
        day:{s:['#122039','#1E3447'],h:['#1B2D3B','#15243A'],st:null,orb:'#E9E2B8'},
        dusk:{s:['#191533','#4A2252'],h:['#2C1C42','#211736'],st:'#A897C9',orb:null},
        night:{s:['#0B0E26','#1B1A45'],h:['#17173C','#101030'],st:'#A7A4DA',orb:'#FFF4C9'}}};
function skyPhase(){const m=state&&state.settings&&state.settings.sky;if(m==='day'||m==='night')return m;const h=new Date().getHours();return h>=5&&h<7?'dawn':h>=7&&h<17?'day':h>=17&&h<20?'dusk':'night';}
function skyDark(){const t=document.documentElement.getAttribute('data-theme');return t==='dark'||(t!=='light'&&!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches));}
let skyKey='';
function drawSky(force){
  const cv=document.getElementById('skyCv');if(!cv)return;
  if(state&&state.settings&&state.settings.sky==='plain'){cv.hidden=true;skyKey='';return;}cv.hidden=false;
  const asp=Math.max(1,innerHeight)/Math.max(1,innerWidth);let W=96,H=Math.round(96*asp);if(H<140){H=140;W=Math.min(400,Math.round(140/asp));}const ph=skyPhase(),dk=skyDark(),k=ph+(dk?1:0)+'/'+W+'x'+H;
  if(!force&&k===skyKey)return;skyKey=k;
  cv.width=W;cv.height=H;
  const P=SKY[dk?'dark':'light'][ph],ctx=cv.getContext('2d'),img=ctx.createImageData(W,H),d=img.data;
  const put=(x,y,c)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;const q=hexRGB(c),o=(y*W+x)*4;d[o]=q[0];d[o+1]=q[1];d[o+2]=q[2];d[o+3]=255;};
  const s0=hexRGB(P.s[0]),s1=hexRGB(P.s[1]),NB=8;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const f=y/H*NB;let bi=Math.floor(f);if(f-bi>(BAY[(y&3)*4+(x&3)]+.5)/16)bi++;const t=Math.min(1,bi/NB),o=(y*W+x)*4;d[o]=lerp(s0[0],s1[0],t);d[o+1]=lerp(s0[1],s1[1],t);d[o+2]=lerp(s0[2],s1[2],t);d[o+3]=255;}
  const r=mulberry32(4242);
  if(P.st)for(let i=0,n=Math.round(W*H/300);i<n;i++){const x=r()*W,y=r()*H*.62;if(y<H*.11&&x<W*.62)continue;put(x,y,P.st);if(x>W*.62&&r()<.18){put(x+1,y,P.st);put(x-1,y,P.st);put(x,y+1,P.st);put(x,y-1,P.st);}}
  if(P.orb){const cx=W-15,cy=Math.round(H*.17),R=ph==='day'?5:4;for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++)if(x*x+y*y<=R*R+1)put(cx+x,cy+y,P.orb);if(ph==='night')for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++)if((x+2)*(x+2)+(y-1)*(y-1)<=R*R-2)put(cx+x+2,cy+y-1,P.s[0]);}
  for(let x=0;x<W;x++){const t=Math.round(H*.81+3*Math.sin(x*.11+1)+2*Math.sin(x*.27));for(let y=t;y<H;y++)put(x,y,P.h[0]);}
  for(let x=0;x<W;x++){const t=Math.round(H*.875+2.5*Math.sin(x*.08+3)+1.5*Math.sin(x*.31));for(let y=t;y<H;y++)put(x,y,P.h[1]);}
  ctx.putImageData(img,0,0);
}

/* ---- The realm games (0.25). Played from the Hearth. Your Forgeling shapes its game: one of its stats is a trait, bond

   (a great round may turn up a curio); after that you can keep playing just for fun. ---- */

 {id:'tide',t:'Skipping Stones',h:'Tap Skip, or anywhere on the water, when the stone is over the calm water.',hi:9,mid:5,u:['skip','skips'],si:2,

 {id:'dusk',t:'Lantern Lights',h:'Watch the lanterns, then light them in the same order.',hi:7,mid:4,u:['lantern','lanterns'],si:1,

const unitOf=(G,n)=>n+' '+G.u[n===1?0:1];
const statName=(c,i)=>(c.dark?['Might','Dread','Guile']:['Grit','Spark','Calm'])[i];
const gTrait=(c,G)=>{const v=Array.isArray(c.stats)?+c.stats[G.si]:0;return Math.max(0,Math.min(1,((Number.isFinite(v)?v:15)-15)/84));};
const GIFT_LV=3;
let game=null;
function openPlay(c,gi){
  const free=visitsLeft()<1,G=Number.isInteger(gi)&&GAMES[gi]?GAMES[gi]:gameFor(c),best=state.games.best[G.id]||0,gift=bondLevel(c)>=GIFT_LV,twist=!!c.dark,si=G.si,sv=Array.isArray(c.stats)?c.stats[si]:'';

  openOverlay(`<p class="rv-title">${G.t}</p><p class="rv-hint">${G.h}${best?` Best: ${unitOf(G,best)}.`:''}</p>

    <button class="ghost" id="pgSit" data-cid="${c.id}">${free?'Stop playing':'Just sit together instead'}</button>`,false);
  game={c,G,free,score:0,combo:0,alive:true,started:false,timers:[],raf:0,tr:gTrait(c,G),gift,twist};
  pgT={stop:()=>{if(!game)return;game.alive=false;game.started=false;game.timers.forEach(t=>{clearInterval(t);clearTimeout(t);});clearTimeout(game.ct);cancelAnimationFrame(game.raf);}};

/* 0.25.2: any Forgeling plays any game. Pick who plays from the Forgelings by the fire (never one out wandering), then
   any of the five games. A Forgeling's own realm game is its Home game and comes first. */
const realmOf=c=>Math.abs(c.theme|0)%5;
function gPlayers(){const away=state.wander&&state.wander.id;return slotCards().filter(x=>x&&x.id!==away);}
function openGames(c){
  const ps=gPlayers();if(!c||!ps.some(x=>x.id===c.id))c=ps[0];if(!c){toast('Bring a Forgeling to the fire to play.');return;}
  const left=visitsLeft(),home=realmOf(c),order=[home].concat([0,1,2,3,4].filter(i=>i!==home)),n=c.nick||c.name;
  openSheet(`<h2>Play a game</h2><p class="muted small">${left?`Visits left today: ${left} of 3. A round grows the bond of the Forgeling who plays.`:'Your visits are used up for today, so these are just for fun.'}</p>
    ${ps.length>1?`<div class="gwho" role="group" aria-label="Who plays">${ps.map(p=>`<button data-gwho="${p.id}" aria-pressed="${p.id===c.id}"><img src="${spriteURL(p)}" alt="">${esc(p.nick||p.name)}</button>`).join('')}</div>`:''}
    ${order.map(ti=>{const G=GAMES[ti],best=state.games.best[G.id]||0;
      return `<button class="moodbtn" data-game="${ti}" data-cid="${c.id}"><img class="gpick" src="${spriteURL(c)}" alt=""><div><b>${G.t}${ti===home?'<span class="home">Home</span>':''}</b><span>${esc(n)} plays${best?`. Best: ${unitOf(G,best)}`:''}</span></div></button>`;}).join('')}
    <div class="row" style="justify-content:center"><button class="ghost" data-close>Not now</button></div>`);
  const f=$('#modal [data-game]');if(f)f.focus({preventScroll:true});
}
function gStart(){
  const g=game;if(!g||!g.alive||g.started||g.ending)return;const r=$('#pgReady');if(r)r.remove();g.started=true;gTone('go');
  ({meadow:gMeadow,ember:gEmber,tide:gTide,frost:gFrost,dusk:gDusk})[g.G.id]();

const SPR_URL={};
function spriteURL(c){const k=ckey(c);if(SPR_URL[k])return SPR_URL[k];try{const e=prep(c);if(!e.sp[0])e.sp[0]=buildSprite(e.spec,0,0);const g=e.sp[0],cv=document.createElement('canvas');cv.width=32;cv.height=32;const x=cv.getContext('2d'),im=x.createImageData(32,32);for(let i=0;i<1024;i++){const sl=g[i];if(!sl)continue;const q=e.pal[sl];im.data[i*4]=q[0];im.data[i*4+1]=q[1];im.data[i*4+2]=q[2];im.data[i*4+3]=255;}x.putImageData(im,0,0);return SPR_URL[k]=cv.toDataURL();}catch(err){return '';}}
const mateHTML=c=>{const u=spriteURL(c);return u?`<img class="pgmate" src="${u}" alt="">`:'';};
/* ---- shared feel: score, streaks, sparkles, sounds, messages, the finish ---- */
const gOn=()=>!!(game&&game.alive&&game.started);
const gScore=v=>{game.score=v;const s=$('#pgScore');if(s)s.textContent=v;const m=document.querySelector('#pg .pgmate');if(m){m.classList.remove('hop');void m.offsetWidth;m.classList.add('hop');}};
function gPos(el){const a=$('#pg');if(!a||!el)return [0,0];const r=el.getBoundingClientRect(),q=a.getBoundingClientRect();return [r.left-q.left+r.width/2,r.top-q.top+r.height/2];}
function gStreak(){const e=$('#pgStreak');if(e&&game)e.textContent=game.combo>=3?'Streak '+game.combo:'';}
function gFloat(x,y,t){if(REDUCE)return;const a=$('#pg');if(!a)return;const e=document.createElement('span');e.className='ptx';e.setAttribute('aria-hidden','true');e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';a.appendChild(e);setTimeout(()=>e.remove(),720);}
function gBurst(x,y,col){if(REDUCE)return;const a=$('#pg');if(!a)return;for(let i=0;i<7;i++){const e=document.createElement('i'),an=i/7*6.28+Math.random()*.5,d=16+Math.random()*16;e.className='pt';e.setAttribute('aria-hidden','true');e.style.cssText=`left:${Math.round(x)}px;top:${Math.round(y)}px;background:${col};--dx:${Math.round(Math.cos(an)*d)}px;--dy:${Math.round(Math.sin(an)*d)}px`;a.appendChild(e);setTimeout(()=>e.remove(),520);}}
function gMsg(t){const m=$('#pgMsg');if(m)m.textContent=t;}
function gHit(pts,x,y,col,tone){buzz('LIGHT');const g=game;g.combo++;clearTimeout(g.ct);g.ct=setTimeout(gBreak,2000);let add=pts;gFloat(x,y,'+'+pts);
  if(g.combo%5===0){add+=2;gFloat(x,y-22,'Streak! +2');gTone('gold');}else gTone(tone||'hit',Math.min(7,g.combo-1));
  gBurst(x,y,col);gScore(g.score+add);gStreak();}
function gMiss(cost,x,y){const g=game;g.combo=0;clearTimeout(g.ct);gStreak();if(cost){gScore(Math.max(0,g.score-cost));gFloat(x,y,'−'+cost);}sfx('no');}
function gBreak(){if(game&&game.combo){game.combo=0;gStreak();}}
function gClock(sec){let left=sec;game.timers.push(setInterval(()=>{if(!gOn())return;left--;const t=$('#pgTime');if(t)t.textContent=Math.max(0,left)+'s';if(left<=0)gEnd('Time!');},1000));}
function gEnd(txt){const g=game;if(!g||!g.alive||g.ending)return;g.ending=true;g.started=false;const a=$('#pg');
  if(a&&txt)a.insertAdjacentHTML('beforeend',`<div class="pgend" aria-hidden="true">${txt}</div>`);gTone('time');g.timers.push(setTimeout(finishGame,REDUCE?350:900));}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51];
const GT={hit:s=>[{f:PENTA[s],dur:.09,gain:.16,type:'triangle'}],
  gold:()=>[3,5,7].map((i,k)=>({f:PENTA[i],dur:.12,gain:.15,type:'triangle',delay:k*.05})),
  crackle:s=>[{f:200+s*30,f2:110,dur:.07,gain:.15}],
  plip:s=>[{f:PENTA[s],f2:PENTA[s]*1.5,dur:.11,gain:.15,type:'sine'}],
  lant:s=>[{f:[392,493.88,587.33,698.46][s&3],dur:.32,gain:.18,type:'triangle'}],
  log:()=>[{f:196,dur:.18,gain:.18,type:'triangle'},{f:294,dur:.22,gain:.16,type:'triangle',delay:.08}],
  wind:()=>[{f:340,f2:160,dur:.6,gain:.07,type:'sine'}],
  go:()=>[{f:523.25,dur:.08,gain:.15,type:'triangle'},{f:783.99,dur:.14,gain:.15,type:'triangle',delay:.09}],
  time:()=>[{f:659.25,dur:.12,gain:.15,type:'triangle'},{f:523.25,dur:.22,gain:.15,type:'triangle',delay:.12}]};
function gTone(k,s){if(!state||state.settings.sfx===false||!sOn()||!GT[k])return;try{s=s|0;playNotes(GT[k](s),'g'+k+s,.5);}catch(e){}}
/* ---- Dandelion Drift (Meadow): Spark brings golden seeds ---- */
function gMeadow(){
  const g=game,area=$('#pg'),gold=.06+.12*g.tr,t0=performance.now();let items=[],last=t0,nextPuff=t0+4000;
  const add=(kind,x,v,y0)=>{const b=document.createElement('button');b.type='button';b.className='seed'+(kind==='seed'?'':' '+kind);
    b.setAttribute('aria-label',{gold:'Golden seed',thorn:'Thorny burr',puff:'Dandelion puff'}[kind]||'Seed');b.style.left=x+'%';
    const o={el:b,kind,x,y:y0||0,v,ph:Math.random()*6.28};
    b.addEventListener('pointerdown',ev=>{ev.preventDefault();if(o.done||!gOn())return;o.done=1;const p=gPos(b);b.classList.add('caught');setTimeout(()=>b.remove(),160);
      if(kind==='thorn'){gMiss(2,p[0],p[1]);return;}
      if(kind==='puff'){gHit(1,p[0],p[1],'#FFFFFF');for(let i=0;i<5;i++)add('seed',Math.max(4,Math.min(82,o.x+(i-2)*9)),o.v*.7,Math.max(0,o.y-30+i*12));return;}
      gHit(kind==='gold'?3:1,p[0],p[1],kind==='gold'?'#FFD36B':'#F4F0E8');});
    area.appendChild(b);items.push(o);};
  const spawn=()=>{if(!gOn())return;const k=Math.min(1,(performance.now()-t0)/20000),H=area.clientHeight,r=Math.random();
    add(g.twist&&r<.2?'thorn':(r>1-gold?'gold':'seed'),4+Math.random()*78,(H+48)/((3.6-1.2*k)*(.9+Math.random()*.2)));
    g.timers.push(setTimeout(spawn,620-280*k));};
  const loop=now=>{if(!gOn())return;const dt=Math.min(.05,(now-last)/1000),H=area.clientHeight;last=now;
    if(g.gift&&now>nextPuff){nextPuff=now+6500;add('puff',10+Math.random()*60,(H+64)/5.5);}
    items=items.filter(o=>{if(o.done)return false;o.y+=o.v*dt;if(o.y>H+60){o.el.remove();return false;}
      o.el.style.transform=`translate(${Math.round(Math.sin(o.ph+o.y/60)*12)}px,${-Math.round(o.y)}px)`;return true;});
    g.raf=requestAnimationFrame(loop);};
  g.raf=requestAnimationFrame(loop);spawn();gClock(20);
}
/* ---- Keep the Fire (Ember): Grit slows the burn ---- */
function gEmber(){
  const g=game,area=$('#pg'),burn=1.1*(1-.3*g.tr),t0=performance.now();let heat=60,gust=0,nextLog=t0+5000,nextGust=t0+4500;
  area.insertAdjacentHTML('afterbegin','<div class="heat" aria-hidden="true"><i></i></div><div class="fire" aria-hidden="true"><i></i><b></b></div>');
  const draw=()=>{const f=area.querySelector('.fire i'),h=area.querySelector('.heat i');if(f)f.style.setProperty('--h',Math.max(8,heat)+'%');if(h)h.style.width=heat+'%';};draw();
  g.timers.push(setInterval(()=>{if(!gOn())return;const now=performance.now(),k=Math.min(1,(now-t0)/20000);
    if(g.twist&&now>nextGust){nextGust=now+5200+Math.random()*2000;gust=now+1800;area.classList.add('wind');gTone('wind');gMsg('A cold wind blows…');g.timers.push(setTimeout(()=>{area.classList.remove('wind');if(gOn())gMsg('');},1800));}
    heat=Math.max(0,heat-burn*(1+.6*k)*(now<gust?2:1));draw();if(heat<=0){gMsg('The fire went out.');gEnd(null);}},100));
  const spawn=()=>{if(!gOn())return;const now=performance.now(),k=Math.min(1,(now-t0)/20000),log=g.gift&&now>nextLog;if(log)nextLog=now+6500;
    const b=document.createElement('button');b.className='emb'+(log?' log':'');b.type='button';b.setAttribute('aria-label',log?'Log':'Ember');
    let x,y;do{x=6+Math.random()*80;y=14+Math.random()*70;}while(x>32&&x<62&&y>44);b.style.left=x+'%';b.style.top=y+'%';
    b.addEventListener('pointerdown',ev=>{ev.preventDefault();if(b._c||!gOn())return;b._c=1;heat=Math.min(100,heat+(log?35:13));draw();const p=gPos(b);b.classList.add('caught');setTimeout(()=>b.remove(),160);gHit(log?3:1,p[0],p[1],log?'#C98B4E':'#FF8A2E',log?'log':'crackle');});
    area.appendChild(b);g.timers.push(setTimeout(()=>{if(!b._c)b.remove();},(log?1900:1400-450*k)));
    g.timers.push(setTimeout(spawn,620-200*k));};
  spawn();gClock(20);
}
/* ---- Skipping Stones (Tide): Calm widens the calm water ---- */
function gTide(){
  const g=game,area=$('#pg'),base=.34+.08*g.tr,t0=performance.now();let zone=base,miss=0,speed=1.4,ph=0,last=t0,p=.5;
  area.insertAdjacentHTML('afterbegin','<div class="water" aria-hidden="true"><div class="calm" id="pgCalm"></div><div class="stone" id="pgStone"></div></div><p class="skips" id="pgSkips">Three misses and the stone sinks.</p>');
  const calm=$('#pgCalm'),stone=$('#pgStone'),ctr=()=>g.twist?.5+.16*Math.sin((performance.now()-t0)/1000*.9):.5;
  const place=()=>{const c=ctr();calm.style.left=((c-zone/2)*100)+'%';calm.style.width=(zone*100)+'%';};place();
  const loop=now=>{if(!gOn())return;const dt=Math.min(.05,(now-last)/1000);last=now;ph+=dt*speed*Math.PI*.5;p=(Math.sin(ph-Math.PI/2)+1)/2;stone.style.left=(p*100)+'%';if(g.twist)place();g.raf=requestAnimationFrame(loop);};
  g.raf=requestAnimationFrame(loop);
  game.skip=()=>{if(!gOn())return;const c=ctr(),d=Math.abs(p-c),hit=d<=zone/2,sk=$('#pgSkips');
    const r=document.createElement('div');r.className='ripple';r.style.left='calc(12px + '+(p*100)+'% - '+(p*24)+'px)';area.appendChild(r);setTimeout(()=>r.remove(),520);
    const x=12+p*(area.clientWidth-24);
    if(hit){g.combo++;gScore(g.score+1);gTone('plip',Math.min(7,g.score-1));gBurst(x,160,'#FFFFFF');gFloat(x,140,d<=zone*.15?'Perfect!':'+1');
      zone=Math.max(.14,zone-.025);speed=Math.min(3,speed+.12);
      if(g.gift&&g.score%5===0){zone=Math.min(base,zone+.09);gMsg('A lucky stone! The calm water widens.');}
      place();if(sk)sk.textContent=g.score===1?'One skip!':g.score+' skips!';}
    else{miss++;gMiss(0);if(sk)sk.textContent=miss>=3?'The stone sank.':(3-miss)+(3-miss===1?' miss left.':' misses left.');if(miss>=3)gEnd('Splash!');}};
  area.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;ev.preventDefault();game&&game.skip&&game.skip();});
  gClock(20);
}
/* ---- Snowflake Catch (Frost): Calm slows the snow ---- */
function gFrost(){
  const g=game,area=$('#pg'),slow=1-.22*g.tr,t0=performance.now();
  area.insertAdjacentHTML('afterbegin','<div class="basket" id="pgBasket" aria-hidden="true">'+mateHTML(g.c)+'</div>');
  const W=()=>area.clientWidth,bk=$('#pgBasket');let bx=.5,flakes=[],last=t0,nextBig=t0+4500;
  const setX=v=>{bx=Math.max(.08,Math.min(.92,v));bk.style.left=(bx*100)+'%';};setX(.5);
  const fromEv=ev=>{const r=area.getBoundingClientRect();setX((ev.clientX-r.left)/r.width);};
  let drag=false;area.addEventListener('pointerdown',ev=>{if(!gOn())return;ev.preventDefault();drag=true;try{area.setPointerCapture(ev.pointerId);}catch(e){}fromEv(ev);});
  area.addEventListener('pointermove',ev=>{if(gOn()&&(drag||ev.pointerType==='mouse'))fromEv(ev);});['pointerup','pointercancel','lostpointercapture'].forEach(t=>area.addEventListener(t,()=>{drag=false;}));
  game.nudge=d=>{if(gOn())setX(bx+d);};
  const spawn=()=>{if(!gOn())return;const now=performance.now(),k=Math.min(1,(now-t0)/20000),big=g.gift&&now>nextBig,hail=!big&&g.twist&&Math.random()<.2;if(big)nextBig=now+5500;
    const f=document.createElement('div');f.className='flake'+(big?' big':hail?' hail':'');f.setAttribute('aria-hidden','true');
    const o={el:f,kind:big?'big':hail?'hail':'flake',x:.06+Math.random()*.88,y:-30,v:(70+Math.random()*60)*slow*(1+.5*k)*(big?.8:1)};f.style.left=(o.x*100)+'%';f.style.top='-30px';area.appendChild(f);flakes.push(o);
    g.timers.push(setTimeout(spawn,520-220*k));};
  const loop=now=>{if(!gOn())return;const dt=Math.min(.05,(now-last)/1000);last=now;const H=area.clientHeight,bw=72/Math.max(1,W());
    flakes=flakes.filter(o=>{o.y+=o.v*dt;o.el.style.top=o.y+'px';
      if(o.y>H-84&&o.y<H-40&&Math.abs(o.x-bx)<bw/2+.03){const x=o.x*W(),y=o.y;o.el.remove();
        if(o.kind==='hail')gMiss(2,x,y);else gHit(o.kind==='big'?3:1,x,y,'#FFFFFF');return false;}
      if(o.y>H){o.el.remove();return false;}return true;});
    g.raf=requestAnimationFrame(loop);};
  g.raf=requestAnimationFrame(loop);spawn();gClock(20);
}
/* ---- Lantern Lights (Dusk): Spark makes each lantern glow longer ---- */
function gDusk(){
  const g=game,area=$('#pg'),cols=['#FFD36B','#F29BB5','#A6D8F2','#B5DDB5'],names=['Gold','Rose','Blue','Green'];
  area.insertAdjacentHTML('afterbegin',`<div class="lanterns">${cols.map((c,i)=>`<button class="lant" data-lant="${i}" style="--lc:${c}" aria-label="${names[i]} lantern" disabled></button>`).join('')}</div>`);
  const L=[...area.querySelectorAll('.lant')],seq=[],t=$('#pgTime'),show=Math.round(420*(1+.35*g.tr));let step=0,input=false,star=g.gift?1:0;
  const flash=(i,ms)=>{L[i].classList.add('on');gTone('lant',i);g.timers.push(setTimeout(()=>L[i].classList.remove('on'),ms));};
  const play=()=>{input=false;L.forEach(b=>b.disabled=true);step=0;gMsg('Watch.');if(t)t.textContent='Round '+seq.length;
    const gap=g.twist?Math.max(400,show+220-45*(seq.length-1)):show+220;
    seq.forEach((v,k)=>g.timers.push(setTimeout(()=>{if(gOn())flash(v,Math.min(show,gap-120));},600+k*gap)));
    g.timers.push(setTimeout(()=>{if(!gOn())return;input=true;L.forEach(b=>b.disabled=false);gMsg('Your turn.');L[0].focus({preventScroll:true});},600+seq.length*gap));};
  const round=()=>{if(!gOn())return;seq.push(Math.floor(Math.random()*4));play();};
  L.forEach((b,i)=>b.addEventListener('click',()=>{if(!input||!gOn())return;flash(i,220);
    if(i!==seq[step]){input=false;
      if(star){star=0;g.combo=0;gMsg('The evening star forgives you. Watch again.');g.timers.push(setTimeout(()=>{if(gOn())play();},1300));return;}
      gMsg('The lanterns flicker out.');sfx('no');gEnd(null);return;}
    step++;if(step===seq.length){gScore(seq.length);const p=gPos(area.querySelector('.lanterns'));gBurst(p[0],p[1],cols[i]);gFloat(p[0],p[1],seq.length+'!');
      if(seq.length>=12){gEnd('All twelve!');return;}input=false;g.timers.push(setTimeout(round,700));}}));
  round();
}
function finishGame(){
  const g=game;if(!g||!g.alive)return;if(pgT){pgT.stop();}pgT=null;game=null;
  const G=g.G,score=g.score,best=state.games.best[G.id]||0,nb=score>best&&score>0;if(nb)state.games.best[G.id]=score;state.games.played=(state.games.played||0)+1;save();
  const n=g.c.nick||g.c.name;
  if(g.free){
    openOverlay(`<p class="rv-title">${G.t}</p><p class="rv-title" style="font-size:30px">${unitOf(G,score)}</p><p class="rv-hint">${nb?'A new best!':best?'Best: '+unitOf(G,best)+'.':''} ${esc(n)} ${g.c.dark?'seems quietly pleased.':'had a lovely time.'}</p>
      <div class="pgbtnrow"><button class="primary" id="pgAgain" data-cid="${g.c.id}" data-gi="${GAMES.indexOf(G)}">Play again</button><button class="ghost" id="pgDone">Done</button></div>`,false);
    return;
  }
  const m=g.twist?.8:1,pts=score>=Math.ceil(G.hi*m)?3:score>=Math.ceil(G.mid*m)?2:1;
  let line=g.c.dark?`${n} rumbles with approval. ${unitOf(G,score)}.`:`${n} cheers. ${unitOf(G,score)}!`;
  if(pts===3&&state.games.curioDay!==todayKey()&&Math.random()<.4){
    const ti=Math.abs(g.c.theme|0)%5,all=rCurios(ti),un=all.filter(x=>!state.curios[x.id]),pool=un.length?un:all,cu=pool[Math.floor(Math.random()*pool.length)];
    if(cu){const cur=state.curios[cu.id]||{n:0,cid:g.c.id,at:todayKey()};cur.n++;state.curios[cu.id]=cur;state.games.curioDay=todayKey();const nw=cur.n===1,q=taleOf(cu.id);line+=` Afterwards, ${n} found something nearby: ${cu.name.toLowerCase()}.`+(nw&&q&&loreOn()?(talePages(q.ti)===4?` It holds the last page of an old ${mapName(q.ti)} tale. The tale is whole. Read it on the Map tab, under Tales.`:` It remembers a page of an old ${mapName(q.ti)} tale. Read it on the Map tab, under Tales.`):'');}
  }
  if(nb)line+=' A new best!';
  doVisit(g.c,'play',pts,line);
}

/* ---- 0.32: reminders in the iPhone app. One gentle nudge, never a pile. ---- */
let remT=null;
const remindSoon=()=>{if(!NATIVE||!PL.LocalNotifications)return;clearTimeout(remT);remT=setTimeout(()=>remindSync(false),1000);};
const NUDGE_L=['Today’s card is waiting by the fire.','Your Forgelings saved you a warm spot.','One small thing today? Your card is ready when you are.','The fire is lit. Today’s card is face down, waiting.'];
function nudgeAt(t){const m=/^(\d{1,2}):(\d{2}) (am|pm)$/.exec(t||'');if(!m)return null;let h=+m[1]%12;if(m[3]==='pm')h+=12;return [h,+m[2]];}
async function remindSync(ask){
  if(!NATIVE||!PL.LocalNotifications||!state)return false;const LN=PL.LocalNotifications;
  try{
    const want=!!state.settings.nudge||(!!state.wander&&state.settings.wnote!==false);
    let p=await LN.checkPermissions();
    if(p.display!=='granted'){if(!ask||!want)return false;p=await LN.requestPermissions();if(p.display!=='granted'){toast('Notifications are off for Forgelings in your phone’s settings.');return false;}}
    await LN.cancel({notifications:[{id:1},{id:2}]});const list=[],now=new Date(),hm=nudgeAt(state.settings.nudge);
    if(hm){const d=new Date(now);d.setHours(hm[0],hm[1],0,0);if(d<=now||state.status==='done'||state.status==='rest')d.setDate(d.getDate()+1);
      list.push({id:1,title:'Forgelings',body:NUDGE_L[dnum(dkey(d))%NUDGE_L.length],schedule:{at:d,allowWhileIdle:true}});}
    const w=state.wander,c=w&&cardById(w.id);
    if(c&&state.settings.wnote!==false&&w.ready>Date.now()+30000)list.push({id:2,title:'Forgelings',body:`${c.nick||c.name} is back from wandering, with something for your shelf.`,schedule:{at:new Date(w.ready),allowWhileIdle:true}});
    if(list.length)await LN.schedule({notifications:list});
    return true;
  }catch(e){return false;}
}
function remindHTML(){
  if(!NATIVE)return '';const S=state.settings;
  return `<div class="setblock"><b>Reminders</b><p class="muted small">One gentle nudge on days today’s card is still waiting. Never more than one, and missing a day never costs anything.</p>
    <div class="chips" role="group" aria-label="Daily reminder">${[[null,'Off'],['8:00 am','8:00 am'],['12:00 pm','12:00 pm'],['6:00 pm','6:00 pm']].map(a=>`<button class="chip" data-setnudge="${a[0]||''}" aria-pressed="${(S.nudge||null)===a[0]}">${a[1]}</button>`).join('')}</div>
    <div class="chips"><button class="chip" id="setWnote" aria-pressed="${S.wnote!==false}">Tell me when a wanderer is back ${S.wnote!==false?'on':'off'}</button><button class="chip" id="setHaptic" aria-pressed="${S.haptics!==false}">Haptics ${S.haptics!==false?'on':'off'}</button></div></div>`;
}

/* ---- 0.32: the native share sheet, for text and for files ---- */
function nshareFile(blob,name,title){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=async()=>{try{
    const b64=String(fr.result).split(',')[1],w=await PL.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
    await PL.Share.share({title,files:[w.uri],dialogTitle:title});res();}catch(e){rej(e);}};fr.readAsDataURL(blob);});
}
