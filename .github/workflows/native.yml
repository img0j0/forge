# Builds the native apps on GitHub's machines, so no Mac or Android Studio is needed to check them.
# Android: a debug APK you can install on any Android phone (download it from the run's Artifacts).
# iPhone: compiles the Xcode project for the simulator, unsigned, to prove the Swift code builds.
name: Native builds
on:
  push:
    branches: [ios-app]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install pillow
      - run: npm ci
      - run: python3 build-www.py && npx cap sync android && python3 android-setup.py
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: forgelings-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip3 install pillow --break-system-packages || pip3 install pillow
      - run: npm ci
      - run: python3 build-www.py && npx cap sync ios && python3 ios-setup.py
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
        shell: bash -eo pipefail {0}
