<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge (pilot 0.9.8)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:wght@400;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EDF8; --surface:#FFFFFF; --ink:#2E2A47; --muted:#6B6688; --line:#DDD6EE;
  --plum:#5B4A9E; --plum-ink:#FFFFFF; --chip:#EFEAFA; --butter:#FFD36B;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --px:'Press Start 2P','Courier New',monospace; --px2:'VT323','Courier New',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17152A; --surface:#231F3D; --ink:#F1EEFB; --muted:#A9A3C9; --line:#3A345E;
    --plum:#A596F2; --plum-ink:#17152A; --chip:#2D2851;
  }
}
:root[data-theme="dark"]{
  --bg:#17152A; --surface:#231F3D; --ink:#F1EEFB; --muted:#A9A3C9; --line:#3A345E;
  --plum:#A596F2; --plum-ink:#17152A; --chip:#2D2851;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--plum);outline-offset:3px;border-radius:8px}
[hidden]{display:none !important}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.app{max-width:460px;margin:0 auto;min-height:100dvh;padding:10px 16px 104px}
.top{padding:6px 2px 12px}
h1{font:600 27px/1.1 var(--display);margin:0}
h2{font:600 20px/1.2 var(--display);margin:0 0 4px}
h3{font:600 17px/1.2 var(--display);margin:20px 0 8px}
.panel-box{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.deck{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.mini-back{width:58px;height:80px;border-radius:12px;flex:none;background:radial-gradient(circle,rgba(255,255,255,.22) 0 1.6px,transparent 2.4px) 0 0/14px 14px,#5B4A9E;box-shadow:0 4px 0 rgba(46,42,71,.25);display:grid;place-items:center;color:#fff;font:600 12px var(--display);text-align:center;padding:2px}
.primary{display:block;width:100%;background:var(--plum);color:var(--plum-ink);border:0;border-radius:999px;padding:14px 22px;font:600 18px/1.2 var(--display)}
.primary:active{transform:translateY(1px)}
.primary[disabled]{opacity:.5}
.outline{display:block;width:100%;background:transparent;color:var(--plum);border:2px solid var(--plum);border-radius:999px;padding:12px 18px;font:600 17px/1.2 var(--display)}
.ghost{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 6px;font-size:15px}
.pill{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:6px;align-items:center}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;gap:9px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--plum)}
.dot.done{background:var(--plum)} .dot.rest{border-style:dashed;opacity:.55} .dot.skipped{opacity:.25} .dot.now{box-shadow:0 0 0 3px var(--butter)}
.pips{display:flex;gap:8px;margin:10px 0 4px}
.pip{flex:1;height:10px;border-radius:999px;background:var(--chip);border:1.5px solid var(--line)}
.pip.on{background:var(--plum);border-color:var(--plum)}
.latest{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.latest button,.binder button{background:none;border:0;padding:0}
.stat-line{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.stat-chip{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px}
.fchip,.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.fchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 4px}
.binder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center;background:var(--chip);border-radius:20px;padding:12px}
.empty{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--line);font:600 22px var(--display)}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px}

/* Settings */
.setblock{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.setblock b{font:600 17px var(--display)}
.setblock .muted{margin:2px 0 8px}
.numgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.num{background:var(--chip);border-radius:14px;padding:10px 12px}
.num b{display:block;font:600 22px var(--display)} .num span{font-size:13px;color:var(--muted)}
details.dev{margin-top:6px} details.dev summary{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 2px}
.stack{display:grid;gap:10px;margin-top:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px}
.tool b{font:600 16px var(--display)} .tool span{color:var(--muted);font-size:14px}
textarea.box{width:100%;min-height:150px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
table.odds{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.odds th,table.odds td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.odds th:first-child,table.odds td:first-child{text-align:left}

/* Nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);z-index:20;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:460px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:13px;font-weight:700;position:relative}
.tab[aria-current="page"]{color:var(--plum)}
.tab svg{width:26px;height:26px}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:#E5575F;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px}

/* Sheets and overlays */
.scrim{position:fixed;inset:0;background:rgba(20,18,40,.58);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.scrim.dark{align-items:center;background:radial-gradient(circle at 50% 35%,#3A2C6E,#0C0A1C)}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:28px 28px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:94dvh;overflow:auto;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
.ov{width:100%;max-width:460px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:12px;max-height:100dvh;overflow:auto;color:#fff}
.ov .rv-title{font:600 20px var(--display);text-align:center}
.ov .rv-hint{color:#D9D2F5;font-size:15px;text-align:center}
.ov .btnrow{width:100%;max-width:340px}
.ov .primary{background:#FFD36B;color:#2E2A47;max-width:340px}
.ov .primary.alt{background:rgba(255,255,255,.16);color:#fff}
.ov .note{display:block;width:100%;max-width:320px;text-align:left}
.ov .note span{display:block;font-size:14px;color:#D9D2F5;margin-bottom:4px}
.ov .note input{width:100%;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:11px 12px;font:inherit}
.ov .note input::placeholder{color:#B9B2DA}
.sumgrid{display:grid;grid-template-columns:repeat(3,auto);gap:12px;justify-content:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.moodbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;margin-top:10px}
.moodbtn b{font:600 18px var(--display)} .moodbtn span{color:var(--muted);font-size:14px;display:block;line-height:1.3}
.moodbtn i{font-style:normal;font-size:30px}
.packbtn{background:none;border:0;padding:0}
.packbtn svg{width:min(210px,56vw);height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:float 2.6s ease-in-out infinite}
.packbtn.opening svg{animation:shake .6s ease-in-out}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) scale(1.04)}35%{transform:rotate(7deg) scale(1.06)}55%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(5deg) scale(1.1)}}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px 0 0 -4px;pointer-events:none;animation:burst .95s steps(8,end) forwards;z-index:5}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* Today's Vector card (first run and "see the full card") */
.flip{perspective:1100px;width:min(268px,68vw);aspect-ratio:13/19;margin:10px auto 18px}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.25,.4,1)}
.flipped .flip-in{transform:rotateY(180deg)}
.vface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;box-shadow:0 10px 0 rgba(46,42,71,.22)}
.vface.vback{border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:radial-gradient(circle,rgba(255,255,255,.2) 0 1.8px,transparent 2.6px) 0 0/18px 18px,#5B4A9E}
.vface.vback span{font:600 24px var(--display)} .vface.vback small{opacity:.85;font-size:14px}
.vface.vfront{transform:rotateY(180deg);background:#FFFDF8;color:#2E2A47;display:flex;flex-direction:column;border:2px solid #2E2A47}
.vband{flex:none;display:flex;align-items:center;gap:10px;padding:14px;border-bottom:2px solid #2E2A47}
.vband b{font:600 30px/1 var(--display)}
.vbody{padding:12px 14px;display:grid;gap:10px;font-size:clamp(13px,3.5vw,15px);line-height:1.4}
.vbody strong{display:block;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Card extras: Moment back and flip */
.card{transition:transform .17s ease-in}
.card.sq{transform:scaleX(0)}
.cbk{display:none;background:radial-gradient(circle,rgba(255,255,255,.17) 0 .09em,transparent .15em) 0 0/1.2em 1.2em,#4D3E8C;color:#fff;border:.14em solid #2E2A47;flex-direction:column;align-items:center;justify-content:center;gap:.45em;text-align:center;padding:1.4em}
.card.showback .front{display:none}
.card.showback .cbk{display:flex}
.cbk .emb{width:3.6em;height:3.6em}
.cbk .wm{font:400 1.2em/1 var(--px)}
.cbk .rule{width:40%;height:.12em;background:rgba(255,255,255,.5);margin:.3em 0}
.cbk .m1{font:400 1.7em/1.1 var(--px2)} .cbk .m2{font:400 1.4em/1.1 var(--px2);opacity:.85}
.cbk .m3{font:400 1.45em/1.15 var(--px2);max-width:13em;word-wrap:break-word;color:#FFE9A8}
.cbk .m4{font:400 1.05em/1 var(--px2);opacity:.7;margin-top:.4em}
.reduce *,.reduce *::before,.reduce *::after{animation:none !important;transition:none !important}

/* Lore, naming, Chronicle */
.field{display:block;width:100%;text-align:left}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;resize:vertical;min-height:52px}
.form{width:100%;max-width:330px;display:grid;gap:10px;text-align:left;margin:0 auto}
.ov .form{max-width:330px}
.ov .field span{color:#D9D2F5}
.ov .field input{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.ov .field input::placeholder{color:#B9B2DA}
.ov .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.ov .ghost{color:#D9D2F5}
.whisper{font-style:italic;color:#CFC2FF;border-left:3px solid #8E78E8;padding:2px 0 2px 10px;max-width:320px;text-align:left;line-height:1.35;font-size:17px}
.speak{font-style:italic;color:#FFE9A8 !important}
.art.hop{animation:hop .34s steps(5,end)}
@keyframes hop{0%{transform:none}40%{transform:translateY(-.7em)}100%{transform:none}}
.chron{display:flex;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.chron .minibtn{background:none;border:0;padding:0;flex:none}
.cbody{min-width:0;flex:1}
.cbody b{font:600 18px var(--display)}
.world{font-style:italic;color:var(--plum);border-left:3px solid var(--plum);padding-left:10px;margin:6px 0;line-height:1.35}
.mine{color:#7A5200;border-left:3px solid #E0A82E;padding:3px 8px 3px 10px;margin:6px 0;background:rgba(255,211,107,.3);border-radius:0 10px 10px 0;line-height:1.35}
.inkw{color:var(--plum);font-style:italic;font-weight:700}
.inkm{color:#8A5A00;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mine{color:#FFE9A8;background:rgba(255,211,107,.12)}:root:not([data-theme="light"]) .inkm{color:#FFD36B}}
.realm,.calling{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--rc,var(--plum));border-radius:14px;padding:12px 14px;margin-bottom:10px}
.realm.locked{opacity:.65}
.realm b,.calling b{font:600 18px var(--display)}
.realm .tag{font-size:13px;color:var(--muted);margin-left:8px}
.bar2{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.bar2 i{display:block;height:100%;background:var(--plum)}
.tabs .tab{min-width:0}
.ov .btnrow .primary{font-size:16px;padding:13px 8px;white-space:nowrap}

/* Hearth */
.hearthwrap{border-radius:20px;overflow:hidden;border:3px solid var(--line);background:#000}
#hearthCv{display:block;width:100%;height:auto;aspect-ratio:128/72;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.hmsg{margin:10px 2px 8px;font-style:italic;color:var(--plum);min-height:2.7em;line-height:1.35}
.bondbar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.bondbar i{display:block;height:100%;background:linear-gradient(90deg,#FFB347,#FF6A3D)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.act{border:2px solid var(--plum);background:var(--surface);color:var(--plum);border-radius:16px;padding:10px 4px;font:600 16px var(--display);display:flex;flex-direction:column;align-items:center;gap:2px}
.act small{font:600 12px var(--body);color:var(--muted)}
.act[disabled]{opacity:.45}
.shelf{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.shelf span{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:rgba(127,127,127,.14);font-size:21px}.shelf span.off{opacity:.4;font-size:14px;font-weight:700}.wdot{position:absolute;top:3px;left:calc(50% + 9px);width:11px;height:11px;border-radius:50%;background:#FFB347;box-shadow:0 0 0 2px rgba(0,0,0,.28)}
.lbl2{font-weight:700;font-size:14px;color:var(--muted);margin:12px 0 2px}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center;margin:12px 0;max-height:46dvh;overflow:auto}
.pickbtn{background:none;border:3px solid transparent;border-radius:10px;padding:2px}
.pickbtn.on{border-color:var(--plum);background:var(--chip)}
.pg{position:relative;width:100%;max-width:320px;height:340px;border:3px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);overflow:hidden;touch-action:manipulation}
.spk{position:absolute;top:-44px;width:48px;height:48px;border:0;background:none;padding:0;animation:fall linear forwards}
.spk::before{content:'';position:absolute;inset:8px;background:#FFD36B;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.spk.caught{animation:none;opacity:0;transform:scale(1.8);transition:.15s}
@keyframes fall{to{transform:translateY(400px)}}
.tab{font-size:12px}
.tab svg{width:24px;height:24px}

/* Age screen */
.field select{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.ov .field select{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.ov .field select option{color:#2E2A47}

/* Journey, ribbons, favorites */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 2px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.cal .c.done{background:var(--plum);color:var(--plum-ink)}
.cal .c.rest{border:2px dashed var(--plum);background:transparent}
.cal .c.skipped{opacity:.55}
.cal .c.future{opacity:.25}
.cal .c.now{box-shadow:0 0 0 3px var(--butter)}
.ribbons{display:grid;gap:8px}
.rib{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.rib .ico{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--muted);font:600 13px var(--display)}
.rib.on .ico{background:linear-gradient(135deg,#FFD36B,#FF9F43);color:#5A3A00;font-size:18px}
.rib b{font:600 16px var(--display)}
.rib small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.rib .pb{height:6px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:5px}
.rib .pb i{display:block;height:100%;background:var(--plum)}
.binder button{position:relative}
.favmark{position:absolute;top:3px;right:5px;color:#FFD36B;font-size:15px;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.newlist{margin:10px 0 0;padding-left:20px;display:grid;gap:8px}

/* ===== The pixel card (em-based, width = 20em) ===== */
.stage{position:relative;perspective:900px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.stage::before{content:'';position:absolute;inset:-18%;background:radial-gradient(circle,var(--rc,#fff) 0,transparent 62%);opacity:0;transition:opacity .7s;pointer-events:none}
.stage.lit::before{opacity:var(--gl,.4)}
.tilt{position:relative;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s ease-out}
.tilt.rest{transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.card{position:relative;width:20em;height:28em;color:#EDE8FF;text-align:left;filter:drop-shadow(0 .45em .55em rgba(0,0,0,.4))}
.face{position:absolute;inset:0;overflow:hidden;

  wraith:{top:4,poly:[[10,4],[22,4],[26,15],[21,27],[11,27],[6,15]],eyeY:10,gap:2,arm:[7,21],sp:[[8,13],[4,8],[10,11]]},
  beast:{top:9,poly:[[5,17],[10,9],[22,9],[27,17],[24,27],[8,27]],eyeY:14,gap:3,arm:[4,22],sp:[[7,14],[3,10],[10,12]]},
  shard:{top:3,poly:[[16,3],[26,14],[22,27],[10,27],[6,14]],eyeY:12,gap:2,arm:[8,22],sp:[[8,16],[3,12],[10,14]]}
};
function genSpec(c){
  const r=mulberry32(c.seed),rr=mulberry32(c.seed^0x7f4a7c15),pick=a=>a[Math.floor(r()*a.length)];
  const T=THEMES[c.theme],dk=c.dark,P=dk?T.dark:T.cute;
  const s={dark:dk,seed:c.seed,body:pick(P.bodies),flip:r()<.5};
  if(!dk){
    s.shape=pick(['round','tall','wide','chonk']);
    s.ears=r()<.7?pick(BIAS[c.v].ears):pick(['pointy','round','bunny','nubs','antenna','tuft','floppy']);
    s.eyes=r()<.75?pick(BIAS[c.v].eyes):pick(['big','round','dot','sleepy']);
    s.mouth=pick(['smile','cat','open','smile','tiny']);
    s.tail=pick(['curl','fluffy','stub']);
    s.mark=pick(['spots','stripes','none','spots','none']);
  }else{
    s.shape=pick(['hulk','wraith','beast','shard']);
    s.horns=r()<.6?['up','ram','crown'][c.v%3]:pick(['up','ram','crown','none']);
    s.eyes=r()<.6?['glare','slit','hollow','cyclops'][c.v%4]:pick(['glare','slit','hollow','cyclops']);
    s.mouth=pick(['fangs','grin','maw','snarl']);
    s.tail=pick(['spade','scorpion','whip']);
    s.mark=pick(['cracks','runes','ribs','none']);
    s.spines=r()<.5;
  }
  const R=c.rarity;
  s.wings=dk?(rr()<[.2,.35,.55,.85,.7][R]):((R===3&&rr()<.7)||(R===4&&rr()<.55));
  s.third=dk&&R>=2&&rr()<.5;
  s.crown=R===4;s.keep=c.keep||'';
  return s;
}
function makePal(S,c){
  const T=THEMES[c.theme],P=S.dark?T.dark:T.cute,b=S.body,dk=S.dark,p=[];
  p[2]=b;p[3]=mix(shade(b,dk?-.4:-.26),dk?'#2A1A4A':'#5B3E8F',.2);p[4]=shade(b,dk?.22:.34);
  p[1]=dk?mix(shade(b,-.85),'#05040A',.4):shade(b,-.64);
  p[5]=P.belly;p[12]=shade(P.belly,-.2);p[6]=P.accent;p[13]=shade(P.accent,-.28);
  p[7]='#FFFFFF';p[8]=dk?'#0A0810':'#2B2140';p[9]=P.glow||'#FFFFFF';p[10]=P.glow2||'#FFFFFF';
  p[11]=shade(b,dk?-.55:-.42);p[14]=dk?'#E6DEC6':'#FFFFFF';p[15]=dk?'#A89F86':'#D8D0F0';
  p[16]='#FF8FB0';p[17]='#FFD84A';p[18]='#C98A12';
  const out=[[0,0,0]];for(let i=1;i<19;i++)out[i]=hexRGB(p[i]||'#000000');
  const pulse=out.slice();pulse[9]=hexRGB(mix(p[9],p[10],.45));
  return {pal:out,palP:pulse};
}

/* Build one 32x32 frame. bob shifts everything except the feet by one pixel; blink closes the eyes. */
function buildSprite(S,bob,blink){
  const g=new Uint8Array(N*N),oy=bob,fl=S.flip,dk=S.dark;
  const rm=mulberry32(S.seed^0x51ed270b);
  const FOOT=mask(),M=mask();
  let cy,rx,ry,top,eyeY,gap,eh;
  if(!dk){
    const sh=CSH[S.shape];cy=sh.cy+oy;rx=sh.rx;ry=sh.ry;top=cy-ry;
    const tailX=Math.min(16+rx-2,25);
    /* tail */
    const m=mask();
    if(S.tail==='curl')curve(m,[[tailX,cy+3],[tailX+7,cy+4],[tailX+6,cy-5]],3.4,2.2,fl);
    else if(S.tail==='fluffy')fillEll(m,Math.min(tailX+3,28),cy+2,3.6,3.6,fl);
    else fillEll(m,Math.min(tailX+1,29),cy+4,2.4,2.4,fl);
    commit(g,m,S.tail==='fluffy'?{b:5,s:12,h:7}:{});
    /* wings */
    if(S.wings){const w=mask();both(f=>fillEll(w,16-rx-2.5,cy-3,5,3.6,f));commit(g,w,{b:5,s:12,h:7});}
    /* ears */
    const e=mask();let eo={};
    if(S.ears==='pointy')both(f=>fillPoly(e,[[16-rx*.85,top+4],[16-rx*.7,top-6],[16-rx*.2,top+1]],f));
    else if(S.ears==='round')both(f=>fillEll(e,16-rx*.62,top+1.5,3.4,3.4,f));
    else if(S.ears==='bunny')both(f=>fillEll(e,16-rx*.38,top-3,2.6,6.5,f));
    else if(S.ears==='floppy')both(f=>fillEll(e,16-rx-.5,cy-ry*.25,2.6,5,f));
    else if(S.ears==='nubs'){both(f=>fillPoly(e,[[16-rx*.55,top+2],[16-rx*.45,top-3],[16-rx*.2,top+1]],f));eo={b:6,s:13,h:null};}
    else if(S.ears==='antenna'){both(f=>curve(e,[[13,top+2],[11,top-4],[9,top-8]],2,2,f));}
    else if(S.ears==='tuft'){fillEll(e,16,top-2.5,1.8,4);both(f=>fillEll(e,12.5,top-1.5,1.6,3.2,f));eo={b:6,s:13,h:null};}
    commit(g,e,eo);
    if(S.ears==='antenna'){const bl=mask();both(f=>fillEll(bl,9,top-9,2.1,2.1,f));commit(g,bl,{b:6,s:13,h:null});}
    /* feet (not bobbing) */
    both(f=>fillEll(FOOT,16-Math.round(rx*.45),27.5,3.2,2.2,f));commit(g,FOOT,{});
    /* body */
    fillEll(M,16,cy,rx,ry);commit(g,M,{});
    /* belly */
    const bx=16,by=cy+ry*.35,brx=rx*.58,bry=ry*.52;
    const inB=(x,y)=>{const dx=(x+.5-bx)/brx,dy=(y+.5-by)/bry;return dx*dx+dy*dy<=1;};
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(M[y*N+x]&&inB(x,y)&&g[y*N+x]!==1)g[y*N+x]=(!inB(x+1,y)||!inB(x,y+1))?12:5;}
    /* markings */
    if(S.mark==='spots'){for(let i=0;i<3;i++){const sx=16+Math.round((rm()-.5)*rx*1.3),sy=Math.floor(top+3+rm()*ry*.45);for(let a=0;a<2;a++)for(let b=0;b<2;b++){const X=sx+a,Y=sy+b;if(M[Y*N+X]&&g[Y*N+X]!==1&&g[Y*N+X]!==5)g[Y*N+X]=3;}}}
    else if(S.mark==='stripes'){[12,15,16,19].forEach(X=>{for(let Y=top+1;Y<=top+3;Y++){if(M[Y*N+X]&&g[Y*N+X]!==1)g[Y*N+X]=3;}});}
    /* arms */
    const a=mask();both(f=>fillEll(a,16-rx-.5,cy+2,2.1,3,f));commit(g,a,{});
    /* face */
    const gp=Math.max(2,Math.min(5,Math.round(rx*.3)+1));eyeY=Math.round(cy-ry*.22);
    const EY={big:['ppp','wpp','ppp','ppw'],round:['wp','pp','pp'],dot:['wp','pp'],sleepy:['ppp']}[S.eyes];
    const ew=EY[0].length;eh=EY.length;
    const pat=blink&&S.eyes!=='sleepy'?[ 'p'.repeat(ew) ]:EY;
    const ey=blink&&S.eyes!=='sleepy'?eyeY+eh-1:eyeY+(S.eyes==='sleepy'?1:0);
    stamp(g,16-gp-ew,ey,pat,false);stamp(g,16+gp,ey,pat,false);
    stamp(g,16-gp-ew-2,eyeY+eh,['cc'],false);stamp(g,16+gp+ew,eyeY+eh,['cc'],false);
    const MO={smile:['p..p','.pp.'],cat:['p.pp.p','.pppp.'],open:['pppp','.cc.'],tiny:['pp']}[S.mouth];
    stamp(g,16-MO[0].length/2,eyeY+eh+1,MO,false);
    /* crown */
    if(S.crown){const cm=mask();fillPoly(cm,[[12,top-1],[12,top-5],[14,top-3],[16,top-6],[18,top-3],[20,top-5],[20,top-1]]);commit(g,cm,{b:17,s:18,h:null});}
  }else{
    const sh=DSH[S.shape];top=sh.top+oy;eyeY=sh.eyeY+oy;gap=sh.gap;
    /* tail */
    const m=mask();
    if(S.tail==='spade'){curve(m,[[22,25+oy],[29,24+oy],[28,17+oy]],3.2,2,fl);}
    else if(S.tail==='scorpion'){curve(m,[[22,26+oy],[31,22+oy],[29,11+oy],[24,7+oy]],3.4,1.4,fl);}
    else curve(m,[[22,26+oy],[28,29+oy],[30,22+oy],[30,16+oy]],2.4,1.4,fl);
    commit(g,m,{});
    const tipPt=S.tail==='spade'?[28,17+oy]:S.tail==='scorpion'?[24,7+oy]:[30,16+oy];
    const tm=mask();fillEll(tm,tipPt[0],tipPt[1]-.5,S.tail==='spade'?2.8:1.6,S.tail==='spade'?2.8:1.6,fl);commit(g,tm,{b:6,s:13,h:null});
    /* wings */
    if(S.wings){const w=mask(),t=top;both(f=>fillPoly(w,[[12,t+7],[2,t-2],[1,t+6],[4,t+5],[3,t+11],[6,t+9],[6,t+16],[10,t+12],[12,t+14]],f));commit(g,w,{b:11,s:3,h:3});}
    /* horns */
    const hm=mask();
    if(S.horns==='up')both(f=>curve(hm,[[11,top+3],[8,top-2],[9,top-8]],3.4,1.2,f));
    else if(S.horns==='ram')both(f=>curve(hm,[[11,top+4],[4,top],[3,top+7]],3.6,1.4,f));
    else if(S.horns==='crown'){[[11,4],[16,6],[21,4]].forEach(p=>fillPoly(hm,[[p[0]-2.2,top+2],[p[0],top-p[1]+2],[p[0]+2.2,top+2]]));}
    commit(g,hm,{b:14,s:15,h:null});
    /* shoulder spines */
    if(S.spines){const sp=mask();both(f=>fillPoly(sp,sh.sp.map(p=>[p[0],p[1]+oy]),f));commit(g,sp,{b:14,s:15,h:null});}
    /* feet */
    both(f=>fillEll(FOOT,16-6,27.5,3.4,2,f));commit(g,FOOT,{});
    for(const X of [8,10,21,23])g[29*N+X]=14;
    /* body */
    fillPoly(M,sh.poly.map(p=>[p[0],p[1]+oy]));commit(g,M,{});
    /* chest */
    const cb=mask();fillEll(cb,16,top+(27-sh.top)*.62,4.2,5.2);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(cb[y*N+x]&&M[y*N+x]&&g[y*N+x]!==1)g[y*N+x]=5;
    /* markings */
    if(S.mark==='ribs'){for(let k=0;k<3;k++){const Y=Math.floor(top+(27-sh.top)*.5)+k*2;for(let X=14;X<=17;X++)if(M[Y*N+X]&&g[Y*N+X]===5)g[Y*N+X]=11;}}
    else if(S.mark==='cracks'){let X=11,Y=top+2;for(let k=0;k<9;k++){if(M[Y*N+X]&&g[Y*N+X]!==1)g[Y*N+X]=11;Y++;X+=(k%2?1:-1)*(rm()<.5?0:1)+(k%3===0?1:0);}}
    else if(S.mark==='runes'){[[15,top+11],[16,top+11],[15,top+12],[16,top+13],[15,top+14]].forEach(p=>{if(M[p[1]*N+p[0]])g[p[1]*N+p[0]]=6;});}
    /* arms and claws */
    const am=mask();both(f=>fillEll(am,sh.arm[0],sh.arm[1]+oy,2.6,4.8,f));commit(g,am,{});
    for(const sd of [0,1]){const ax=sd?N-1-Math.floor(sh.arm[0]):Math.floor(sh.arm[0]),by=Math.floor(sh.arm[1]+oy+4.8)+1;for(let i=-1;i<=1;i++){const X=ax+i,Y=by;if(X>=0&&X<N&&Y<N)g[Y*N+X]=14;}}
    /* face */
    const gx=gap,ey=eyeY;
    if(S.eyes==='glare'){const L=blink?['gggg']:['gg..','.ggG'],Rr=blink?['gggg']:['..gg','Ggg.'];eh=blink?1:2;stamp(g,16-gx-4,ey+(blink?1:0),L,false);stamp(g,16+gx,ey+(blink?1:0),Rr,false);}
    else if(S.eyes==='slit'){const L=blink?['ggg']:['gpg','gpg','gpg'];eh=blink?1:3;stamp(g,16-gx-3,ey+(blink?1:0),L,false);stamp(g,16+gx,ey+(blink?1:0),L,false);}
    else if(S.eyes==='hollow'){const L=blink?['www']:['www','wpw','www'];eh=blink?1:3;stamp(g,16-gx-3,ey+(blink?1:0),L,false);stamp(g,16+gx,ey+(blink?1:0),L,false);}
    else{const L=blink?['gggggg']:['.gggg.','ggppgg','.gggg.'];eh=blink?1:3;stamp(g,13,ey+(blink?1:0),L,false);}
    if(S.third&&!blink)stamp(g,15,ey-4,['gg','gG'],false);
    const MO={fangs:['pppppp','t.pp.t'],grin:['pppppppp','ptptptpt'],maw:['.pppppp.','pptpptpp','.pppppp.'],snarl:['pppp','tppt']}[S.mouth];
    stamp(g,16-MO[0].length/2,ey+eh+2,MO,false);
    /* halo for legends */
    if(S.crown){const hmk=mask();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(x+.5-16)/6.5,dy=(y+.5-(top-3))/2;const d=dx*dx+dy*dy;if(d>=.62&&d<=1.1)setp(hmk,x,y,false);}
      for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(hmk[y*N+x])g[y*N+x]=17;}
  }

  if(S.keep){
    const half=dk?7:rx,mouthY=eyeY+eh+(dk?2:1);
    if(S.keep==='hat'){const hm=mask();fillPoly(hm,[[12.5,top+2],[19.5,top+2],[16,top-6]]);commit(g,hm,{b:6,s:13,h:null});
      const pm=mask();fillEll(pm,16,top-6.6,1.7,1.7);commit(g,pm,{b:17,s:18,h:null});
      [[14,top+1],[17,top+1],[15,top-2],[16,top-2]].forEach(p=>{const i=p[1]*N+p[0];if(g[i]===6||g[i]===13)g[i]=7;});}
    else if(S.keep==='scarf'){const sy=mouthY+(dk?4:3);for(let dy=0;dy<2;dy++)for(let x=0;x<N;x++){const i=(sy+dy)*N+x;if(M[i]&&g[i]!==1)g[i]=dy?13:6;}
      const tm=mask();fillPoly(tm,[[17,sy+1],[20,sy+1],[20,sy+6],[17,sy+6]]);commit(g,tm,{b:6,s:13,h:null});}
    else if(S.keep==='flower'){const fx=16+Math.round(half*.62),fy=top+3;stamp(g,fx-1,fy-1,['.c.','cyc','.c.'],false);}
  }
  return g;
}

/* ================= Scene (48x37 pixel backdrop) ================= */
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function buildScene(c,rb){
  const W=48,H=37,T=THEMES[c.theme],dk=c.dark,P=dk?T.dark:T.cute,GY=31;
  const rgb=new Uint8Array(W*H*3),foil=new Uint8Array(W*H);
  const put=(x,y,col,f)=>{x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;const q=typeof col==='string'?hexRGB(col):col,i=y*W+x;rgb[i*3]=q[0];rgb[i*3+1]=q[1];rgb[i*3+2]=q[2];foil[i]=f?1:0;};
  const rect=(x0,y0,x1,y1,col)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)put(x,y,col);};
  const ell=(cx,cy,rx,ry,col)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)put(x,y,col);}};
  const poly=(pts,col)=>{const n=pts.length;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=x+.5,py=y+.5;let ins=false;for(let i=0,j=n-1;i<n;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins;}if(ins)put(x,y,col);}};
  if(c.rarity===4){
    const base=dk?P.sky[0]:mix(P.accent,'#0E0B1E',.84),midc=mix(P.accent,'#0E0B1E',dk?.66:.6),c0=hexRGB(base),c1=hexRGB(midc);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dd=Math.hypot((x+.5-24)/24,(y+.5-17)/20),f=Math.max(0,1-dd)*5;let bi=Math.floor(f);if(f-bi>(BAY[(y&3)*4+(x&3)]+.5)/16)bi++;const t=Math.min(1,bi/5)*.9;put(x,y,[lerp(c0[0],c1[0],t),lerp(c0[1],c1[1],t),lerp(c0[2],c1[2],t)],false);}
    const gcol=hexRGB(mix(P.ground[1],'#0E0B1E',.55)),gtop=hexRGB(mix(P.ground[0],'#0E0B1E',.4));
    for(let y=GY;y<H;y++)for(let x=0;x<W;x++)put(x,y,y===GY?gtop:gcol,false);
    const shd=shade(rgbHex(gcol),-.4);for(let x=14;x<=34;x++)put(x,34,shd);for(let x=17;x<=31;x++)put(x,35,shd);
    return {rgb,foil};
  }
  const s0=hexRGB(P.sky[0]),s1=hexRGB(P.sky[1]),NB=6;
  for(let y=0;y<GY;y++)for(let x=0;x<W;x++){const f=y/GY*NB;let bi=Math.floor(f);if(f-bi>(BAY[(y&3)*4+(x&3)]+.5)/16)bi++;const t=Math.min(1,bi/NB);put(x,y,[lerp(s0[0],s1[0],t),lerp(s0[1],s1[1],t),lerp(s0[2],s1[2],t)],true);}
  const R=()=>rb();
  const hills=(col,base,amp,fq,ph)=>{for(let x=0;x<W;x++){const h=Math.round(base+amp*Math.sin(x*fq+ph));for(let y=h;y<GY;y++)put(x,y,col);}};
  const id=T.id;
  if(!dk){
    if(id==='meadow'){ell(40,7,3.6,3.6,'#FFEFA0');ell(10,8,5,2,'#FFFFFF');ell(15,7,4,2.4,'#FFFFFF');ell(33,14,4,1.8,'#FFFFFF');hills('#B7E3A5',GY-5,2,.22,0);hills('#9AD48F',GY-3,1.5,.4,1);}
    else if(id==='ember'){poly([[30,GY],[36,15],[41,15],[47,GY]],'#8A5240');rect(37,15,40,15,'#FF9A3D');ell(39,11,3,2,'#F0D0C0');ell(42,8,2.5,1.8,'#E8C4B4');for(let i=0;i<9;i++)put(R()*W,R()*GY,'#FFE08A');hills('#B8725A',GY-3,1.5,.35,0);}
    else if(id==='tide'){for(let i=0;i<9;i++){const x=R()*W,y=3+R()*24;put(x,y,'#EAFBFF');put(x+1,y,'#BFE9F8');}for(const x of [5,12,38,44])for(let y=GY-9;y<GY;y++)put(x+Math.round(Math.sin(y*.7+x)),y,'#3FA57A');}
    else if(id==='frost'){poly([[0,GY],[10,14],[18,GY]],'#B7CDE8');poly([[14,GY],[26,10],[38,GY]],'#C9DAF0');poly([[30,GY],[40,16],[48,GY]],'#B7CDE8');put(26,10,'#fff');put(25,11,'#fff');put(27,11,'#fff');put(10,14,'#fff');put(40,16,'#fff');for(let i=0;i<18;i++)put(R()*W,R()*GY,'#FFFFFF');}
    else{for(let i=0;i<16;i++)put(R()*W,R()*16,'#FFFFFF');ell(36,9,6,6,'#FFF1C9');put(34,8,'#EADBB0');put(37,11,'#EADBB0');hills('#5A4A9A',GY-6,3,.2,0);}
  }else{

function attachTilt(stage){
  const tilt=$('.tilt',stage);if(!tilt)return;

    tilt.classList.remove('rest','idle');stage.classList.add('tilting');stage._ph=px;
    tilt.style.setProperty('--rx',((py-.5)*-20).toFixed(1)+'deg');tilt.style.setProperty('--ry',((px-.5)*20).toFixed(1)+'deg');
    tilt.style.setProperty('--mx',(px*100).toFixed(0)+'%');tilt.style.setProperty('--my',(py*100).toFixed(0)+'%');};
  const leave=()=>{tilt.classList.add('rest','idle');stage.classList.remove('tilting');stage._ph=null;['--rx','--ry'].forEach(k=>tilt.style.setProperty(k,'0deg'));tilt.style.setProperty('--mx','50%');tilt.style.setProperty('--my','50%');};
  stage.addEventListener('pointermove',move);stage.addEventListener('pointerdown',move);stage.addEventListener('pointerleave',leave);
  stage.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')leave();});stage.addEventListener('pointercancel',leave);
}

    sp.style.setProperty('--dx',(Math.cos(a)*dd).toFixed(0)+'px');sp.style.setProperty('--dy',(Math.sin(a)*dd).toFixed(0)+'px');sp.style.background=cols[i%cols.length];stage.appendChild(sp);setTimeout(()=>sp.remove(),1000);}

function daysBetween(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);}
function checkReturn(){
  if(!state||!state.ageBand||!state.onboarded||!state.cards.length)return false;
  const k=todayKey(),last=state.opens.length?state.opens[state.opens.length-1]:null;
  if(!last||last===k)return false;
  const gap=daysBetween(last,k);if(gap<3)return false;
  const tier=gap>=30?3:gap>=7?2:1,hh=state.hearth;
  if(!hh.sleep||hh.sleep.tier<tier)hh.sleep={tier};
  save();return true;
}

function startWake(){

/* ================= Sound: interface blips, Hearth ambience, optional soft music =================
   Everything is generated on the device. Two engines are available:
   - Standard: the Web Audio API (live synthesis, supports soft music).
   - Compatibility: the same sounds pre-rendered to small audio clips and played through audio elements.
     This works in some places where Web Audio is muted, such as an iPhone on silent. */
const AU={ctx:null,master:null,comp:null,sfx:null,amb:null,mus:null,noise:null,ambRun:null,musRun:null,keep:null,primed:false};
const MEDIA={err:'',cache:{},amb:null};
let hPokeT=-9999;
const sOn=()=>!!state&&state.settings.sound!==false;
const eng=()=>(state&&state.settings.engine==='media')?'media':'std';
const curBd=()=>(state.hearth.bd&&backdropOK(state.hearth.bd))?state.hearth.bd:'';
const mediaVol=()=>state.settings.vol==='quiet'?.45:state.settings.vol==='loud'?1:.8;
function auStatusText(){
  if(eng()==='media')return 'Method: Compatibility. '+(MEDIA.err?'Last problem: '+MEDIA.err+'.':'No problems reported.');
  const c=AU.ctx;
  if(!c)return 'Method: Standard. Sound starts after your first tap.';
  if(c.state==='running')return 'Method: Standard. The engine is running. If you hear nothing, run the sound check.';
  if(c.state==='suspended')return 'Method: Standard. Waiting for a tap to wake it up.';
  return 'Method: Standard. Engine state: '+c.state+'.';
}
function auStatus(){const el=document.getElementById('auStatus');if(el)el.textContent=auStatusText();}

/* ----- Standard engine ----- */
function auInit(){
  if(AU.ctx)return AU.ctx;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    const c=AU.ctx=new C();
    AU.master=c.createGain();AU.sfx=c.createGain();AU.amb=c.createGain();AU.mus=c.createGain();
    AU.comp=c.createDynamicsCompressor();AU.comp.threshold.value=-14;AU.comp.knee.value=12;AU.comp.ratio.value=6;AU.comp.attack.value=.003;AU.comp.release.value=.2;
    [AU.sfx,AU.amb,AU.mus].forEach(g=>g.connect(AU.master));AU.master.connect(AU.comp);AU.comp.connect(c.destination);
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    AU.noise=buf;c.onstatechange=auStatus;auVolumes();
  }catch(e){AU.ctx=null;}
  return AU.ctx;
}

/* A 12 second, seamless loop of fire, plus (optionally) natural sounds that match the backdrop.
   Everything is shaped noise, so there are no pure tones to sound like beeps. */
const AMB_SR=22050,AMB_SECS=12;
function bakeAmb(kind,nature,seed){
  const sr=AMB_SR,secs=AMB_SECS,xf=Math.floor(.4*sr),L=secs*sr,N=L+xf,r=mulberry32(seed);
  const noise=n=>{const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=r()*2-1;return a;};
  const rmsOf=x=>{let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];return Math.sqrt(s/x.length)||1;};

  const layer=(x,target,mod)=>{const k=target/rmsOf(x);for(let i=0;i<N;i++)out[i]+=x[i]*k*(mod?mod(i/sr):1);};
  const swell=(rate,ph)=>t=>{const v=.5+.5*Math.sin(2*Math.PI*rate*t+ph);return .25+.75*v*v;};
  const burst=(at,len,type,fc,Q,amp,decay)=>{const nz=biq(noise(len),type,fc,Q,sr),k=1/rmsOf(nz);for(let i=0;i<len&&at+i<N;i++)out[at+i]+=nz[i]*k*amp*Math.exp(-decay*i/len);};
  /* the fire: a warm bed, a low body, then ticks, crackles and the odd pop */
  layer(biq(biq(noise(N),'bp',380,.7,sr),'lp',1100,.7,sr),.085,t=>1+.3*Math.sin(2*Math.PI*.37*t)+.15*Math.sin(2*Math.PI*.91*t+1));
  layer(biq(noise(N),'lp',110,.7,sr),.045,t=>1+.4*Math.sin(2*Math.PI*.23*t));
  for(let q=0;q<secs*10;q++)burst(Math.floor(r()*(L-1000)),Math.floor((.004+r()*.006)*sr),'hp',4500+r()*3000,.7,.05+r()*.07,5);
  for(let q=0;q<secs*5;q++)burst(Math.floor(r()*(L-3000)),Math.floor((.012+r()*.025)*sr),'hp',2000+r()*2500,.7,.1+r()*.12,6);
  for(let q=0;q<Math.floor(secs*.7);q++)burst(Math.floor(r()*(L-4000)),Math.floor((.03+r()*.03)*sr),'bp',700+r()*600,1.2,.25+r()*.15,5);
  /* nature */
  if(nature){
    if(kind==='crickets'){
      layer(biq(noise(N),'bp',650,.8,sr),.012,swell(.06,1));                       /* a faint night breeze */
      [[4300,18,26,.03],[5100,20,31,.024],[3700,15,23,.02]].forEach((b,j)=>{        /* a far-off chorus */
        const band=biq(noise(N),'bp',b[0],b[1],sr),gate=new Float32Array(N);let g=0,tgt=1,next=0;
        for(let i=0;i<N;i++){if(i>=next){tgt=r()<.65?1:.12;next=i+Math.floor((1+r()*2.2)*sr);}g+=(tgt-g)*.0005;gate[i]=g;}
        const k=b[3]/rmsOf(band);
        for(let i=0;i<N;i++){const t=i/sr,tr=.5+.5*Math.sin(2*Math.PI*(b[2]+2*Math.sin(2*Math.PI*.3*t+j))*t);out[i]+=band[i]*k*gate[i]*(.2+.8*tr*tr);}
      });
      for(let c=0;c<3;c++){                                                         /* a few nearer crickets, never quite regular */
        const fc=4000+r()*800;
        for(let t=.5+r()*1.5;t<secs-.8;t+=.8+r()*1.3){
          const pulses=3+Math.floor(r()*3);
          for(let p=0;p<pulses;p++){const at=Math.floor((t+p*(.032+r()*.014))*sr),len=Math.floor(.013*sr);
            const nz=biq(noise(len),'bp',fc*(1+(r()-.5)*.04),22,sr),k=1/rmsOf(nz),amp=.05+r()*.04;
            for(let i=0;i<len;i++)out[at+i]+=nz[i]*k*amp*Math.sin(Math.PI*i/len);}
        }
      }
    }
    if(kind==='birds'){
      layer(biq(biq(noise(N),'bp',1400,.6,sr),'lp',3200,.7,sr),.03,swell(.09,.5));  /* breeze through leaves */
      layer(biq(noise(N),'bp',4500,.5,sr),.008,swell(.13,2));
      for(let t=2+r()*3;t<secs-1;t+=5+r()*6){                                       /* a rare, soft bird phrase */
        const notes=2+Math.floor(r()*3),base=2500+r()*1200;let at=t;

        }
      }
    }
    if(kind==='wind'){
      layer(biq(noise(N),'bp',350,1.2,sr),.07,swell(.05,0));
      layer(biq(noise(N),'bp',950,1.5,sr),.04,swell(.083,2));
      layer(biq(noise(N),'lp',90,.7,sr),.04);
    }
    if(kind==='cave'){
      layer(biq(noise(N),'lp',100,.7,sr),.07);
      layer(biq(noise(N),'bp',2500,.5,sr),.006);
      for(let t=1+r()*2;t<secs-.6;t+=3.5+r()*3.5){
        [[0,1],[.14,.35]].forEach(d=>{const at=Math.floor((t+d[0])*sr),len=Math.floor(.12*sr),f0=950+r()*300;let ph=0;

      }
    }
  }
  for(let i=0;i<xf;i++){const w=i/xf;out[i]=out[i]*w+out[L+i]*(1-w);}   /* make the loop seamless */

}
function bakePoke(){
  const sr=AMB_SR,N=Math.floor(.7*sr),r=mulberry32(7),out=new Float32Array(N);

    if(s%4===0)toneAt(ch[0],t,.5,.17,'triangle',run.lp);
    if(Math.random()<.5)toneAt(MUS.scale[rand(MUS.scale.length)]*(Math.random()<.25?2:1),t,.35,.11,'square',run.lp);
    run.next+=spb;run.step++;
  }
}
function musStop(){const r=AU.musRun;if(!r)return;AU.musRun=null;clearInterval(r.timer);}

function audioSync(){
  if(!state||!state.ageBand)return;
  if(eng()==='media'){ambStop();musStop();mediaSync();return;}
  mediaAmbStop();
  const c=AU.ctx;if(!c)return;
  auVolumes();if(c.state!=='running')return;
  const wantAmb=sOn()&&state.settings.amb!==false&&tab==='hearth';
  if(wantAmb){if(AU.ambRun&&AU.ambRun.key!==ambKey())ambStop();if(!AU.ambRun)ambStart();}else if(AU.ambRun)ambStop();
  const wantMus=sOn()&&state.settings.music===true;
  if(wantMus&&!AU.musRun)musStart();else if(!wantMus&&AU.musRun)musStop();
}
/* Only real "activation" gestures can unlock audio on phones, so listen for those. */
['pointerup','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(eng()==='std'&&(!AU.primed||(AU.ctx&&AU.ctx.state!=='running')))auPrime();},{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(eng()==='media'){if(document.hidden)mediaAmbStop();else audioSync();return;}
  const c=AU.ctx;if(!c)return;if(document.hidden)c.suspend();else c.resume().then(audioSync).catch(()=>{});
});
document.addEventListener('click',e=>{
  if(!state||!state.settings)return;
  const t=e.target.closest&&e.target.closest('button,[role="button"]');if(!t||t.disabled)return;
  if(t.matches('#cover,#vBack,#packTear,#pgSit,#soundCheck')||t.dataset.sc!==undefined||t.classList.contains('spk'))return;
  if(t.matches('#saveNames,#editSave,#storySave,#jSave,#nudgeOk,#pickSave,#packDone,#vOk,#rvDone'))sfx('save');
  else if(t.classList.contains('tab'))sfx('tab');
  else if(t.classList.contains('chip')||t.classList.contains('fchip'))sfx('select');
  else sfx('tap');
},true);

/* ================= Sheets: odds, backup, restore ================= */
function openOdds(){
  const pc=a=>a.map(n=>n+'%');
  openSheet(`<h2>Fair odds</h2><p class="muted small">Packs are earned by showing up and never sold. These are the odds for every Forgeling you find.</p>
    <table class="odds"><thead><tr><th></th>${['Com','Unc','Rare','Holo','Leg'].map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>
    <tr><td>Daily</td>${pc(ODDS.daily).map(x=>`<td>${x}</td>`).join('')}</tr>
    <tr><td>All in</td>${pc(ODDS.allIn).map(x=>`<td>${x}</td>`).join('')}</tr>
    <tr><td>Pack</td>${pc(ODDS.pack).map(x=>`<td>${x}</td>`).join('')}</tr>
    <tr><td>Last in pack</td>${pc(ODDS.packLast).map(x=>`<td>${x}</td>`).join('')}</tr></tbody></table>
    <p class="small"><b>Safety net.</b> After ${PITY} Forgelings without a Rare or better, your next one is guaranteed to be Rare or better. You are ${Math.max(0,PITY-state.pity.since)} away right now.</p>
    <p class="muted small" style="margin-top:8px">These are pilot odds. They may change before launch, and any change will be shown here.</p>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="ghost" data-close>Close</button></div>`);
}
function openExport(){
  const txt=JSON.stringify(state);
  openSheet(`<h2>Save a copy</h2><p class="muted small">Copy this text and keep it somewhere safe. Paste it into Restore on any device.</p>
    <textarea class="box" id="expText" readonly>${esc(txt)}</textarea>
    <div class="stack"><button class="primary" id="copyExp">Copy</button><button class="ghost" data-close>Close</button></div>`);
  const t=$('#expText');if(t){t.focus();t.select();}
}
function openRestore(){
  openSheet(`<h2>Restore a copy</h2><p class="muted small">Paste a saved copy here. This replaces what is on this device.</p>
    <textarea class="box" id="resText" placeholder="Paste your saved copy"></textarea>
    <div class="stack"><button class="primary" id="doRestore">Restore</button><button class="ghost" data-close>Cancel</button></div>`);
}
function copyText(txt,done){
  try{navigator.clipboard.writeText(txt).then(()=>toast(done),()=>toast('Select the text and copy it.'));}catch(e){toast('Select the text and copy it.');}
}

/* ================= Events ================= */
modal.addEventListener('click',e=>{
  if(e.target.classList.contains('scrim')&&e.target.dataset.dismiss==='true'){closeModal();return;}
  if(e.target.closest('#cover')){if(ovMode==='reveal')revealFlip();else if(ovMode==='pack')packFlip();return;}
  if(ovMode==='inspect'&&e.target.closest('.art')){talk();return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-close')||b.id==='ovClose')closeModal();
  else if(b.id==='vBack')flipVector();
  else if(b.id==='vOk'){state.onboarded=true;save();closeModal();render();}
  else if(b.id==='vDoneNow'){state.onboarded=true;save();closeModal();render();startDone(false);}
  else if(b.dataset.mood){state.settings.mood=b.dataset.mood;state.moodAsked=true;save();closeModal();startDone(pendingAllIn);}
  else if(b.id==='fbGo'){closeModal();tab='settings';render();setTimeout(()=>{const el=$('#fb_confuse');if(el){el.focus({preventScroll:false});el.scrollIntoView({block:'center'});}},250);}
  else if(b.id==='rvName')drawName();
  else if(b.id==='rvSkip'||b.id==='skipNames')finishReveal();
  else if(b.id==='saveNames'){readForm(cardById(form.id));finishReveal();}
  else if(b.id==='editSave'){const c=cardById(form.id),back=form.back;readForm(c);closeModal();render();if(back==='inspect')inspect(c.id);}
  else if(b.id==='nickMore'){form.nk++;$('#nickChips').innerHTML=nickChipsHTML(cardById(form.id));}
  else if(b.dataset.nick){$('#nickIn').value=b.dataset.nick;syncNick();}
  else if(b.id==='taleMore'){form.tk++;syncNick();}
  else if(b.id==='ageGo')submitAge();
  else if(b.dataset.sc){scChoose(b.dataset.sc);}
  else if(b.id==='inspFav'){const c=cardById(inspId);if(c){c.fav=!c.fav;save();b.textContent=c.fav?'\u2605 Favorited':'\u2606 Favorite';renderBinder();renderHearth();}}
  else if(b.id==='inspName')openEdit(inspId,'inspect');
  else if(b.dataset.snack!==undefined){const c=slotCards()[hf.sel];if(c){const fav=+b.dataset.snack===c.seed%4;doVisit(c,'snack',fav?2:1,lineFor(c,fav?'snackFav':'snack',''));}}
  else if(b.id==='storySave'){const c=slotCards()[hf.sel],t=(($('#storyIn')||{}).value||'').trim();if(c){if(t){c.fire=(c.fire||[]).concat([{date:todayKey(),text:t}]);}doVisit(c,'story',2,lineFor(c,'story',''));renderChronicle();}}
  else if(b.id==='pgSit'){const c=cardById(+b.dataset.cid);if(c){if(pgT){pgT.stop();pgT=null;}doVisit(c,'sit',1,lineFor(c,'sit',''));}}
  else if(b.dataset.pick){const id=+b.dataset.pick,i=pickSel.indexOf(id);if(i>=0){pickSel.splice(i,1);b.classList.remove('on');b.setAttribute('aria-pressed','false');}else if(pickSel.length<3){pickSel.push(id);b.classList.add('on');b.setAttribute('aria-pressed','true');}else{sfx('no');toast('Three is plenty for one fire.');}}
  else if(b.id==='pickSave'){state.hearth.slots=pickSel.slice();hf.sel=0;hf.msg='';save();closeModal();renderHearth();toast(pickSel.length?'The fire has new company.':'The fire will pick someone for you.');}
  else if(b.dataset.equip){const c=cardById(+b.dataset.cid);if(c){c.keep=b.dataset.equip;save();closeModal();renderHearth();renderChronicle();}}
  else if(b.id==='packTear'){b.classList.add('opening');chime(1);setTimeout(()=>{if(!pk)return;pk.step='card';pk.i=0;pk.flipped=false;drawPack();},650);}
  else if(b.id==='packNext'){if(pk.i<4){pk.i++;pk.flipped=false;drawPack();}else{pk.step='sum';drawPack();}}
  else if(b.id==='packDone'){closeModal();tab='binder';bf={type:'all',mood:'all',sort:'new',page:0};render();window.scrollTo(0,0);}
  else if(b.id==='inspFlip')flipCard();
  else if(b.dataset.time){state.settings.nudge=b.dataset.time;save();modal.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b?'true':'false'));}
  else if(b.id==='nudgeOk'){closeModal();renderSettings();toast(state.settings.nudge?`Nudge set for ${state.settings.nudge}. Nothing is sent in this prototype.`:'No nudge. You can change this in Settings.');}
  else if(b.id==='copyExp')copyText($('#expText').value,'Copied. Keep it somewhere safe.');
  else if(b.id==='doRestore'){
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Tap again to replace this device';return;}
    try{const s=JSON.parse($('#resText').value.trim());if(!(s&&s.v===1&&Array.isArray(s.cards)&&s.settings))throw 0;s.ageBand=s.ageBand||state.ageBand;state=migrate(s);rollover();save();applySettings();closeModal();tab='today';render();toast('Restored.');}
    catch(err){b.dataset.armed='0';b.textContent='Restore';sfx('no');toast('That does not look like a saved copy.');}
  }
});
modal.addEventListener('input',e=>{if(e.target.id==='nickIn')syncNick();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden){const s=modal.querySelector('.scrim');if(s&&s.dataset.dismiss==='true')closeModal();}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;if(tab==='settings')renderSettings();if(tab==='chronicle')renderChronicle();if(tab==='hearth')renderHearth();renderNav();window.scrollTo(0,0);}));
$('#view-today').addEventListener('click',e=>{
  const ins=e.target.closest('[data-insp]');if(ins){inspect(+ins.dataset.insp);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='btnTurn'||b.id==='btnCard')openVector();
  else if(b.id==='btnDone')startDone(false);
  else if(b.id==='btnAll')startDone(true);
  else if(b.id==='btnPack')openPack();
  else if(b.id==='btnHearth'){tab='hearth';renderHearth();renderNav();window.scrollTo(0,0);}
  else if(b.id==='btnShowToday')inspect(state.todayCard);
  else if(b.id==='btnRest')restToday();
  else if(b.id==='btnUnrest')unrest();
  else if(b.id==='jSave'){saveJournal(($('#jIn')||{}).value||'');ui.editJ=false;renderToday();renderChronicle();checkRibbons();toast('Saved. It stays on this device.');}
  else if(b.id==='jEdit'){ui.editJ=true;renderToday();}
});
$('#view-binder').addEventListener('click',e=>{
  const ins=e.target.closest('[data-insp]');if(ins){inspect(+ins.dataset.insp);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ftype!==undefined){bf.type=b.dataset.ftype;bf.page=0;renderBinder();}
  else if(b.dataset.fmood){bf.mood=b.dataset.fmood;bf.page=0;renderBinder();}
  else if(b.id==='fFav'){bf.fav=!bf.fav;bf.page=0;renderBinder();}
  else if(b.id==='btnSort'){bf.sort=bf.sort==='new'?'rare':'new';bf.page=0;renderBinder();}
  else if(b.id==='pgPrev'&&bf.page>0){bf.page--;renderBinder();}
  else if(b.id==='pgNext'){bf.page++;renderBinder();}
});
$('#view-chronicle').addEventListener('click',e=>{
  const ins=e.target.closest('[data-insp]');if(ins){inspect(+ins.dataset.insp);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sub){ch.sub=b.dataset.sub;ch.more=1;renderChronicle();}
  else if(b.id==='chMore'){ch.more++;renderChronicle();}
  else if(b.dataset.edit)openEdit(+b.dataset.edit,'none');
});
$('#view-settings').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.setmood){state.settings.mood=b.dataset.setmood;state.moodAsked=true;save();renderSettings();toast('Saved. New finds will follow this.');}
  else if(b.id==='setSound'){state.settings.sound=state.settings.sound===false;save();renderSettings();audioSync();sfx('select');}
  else if(b.id==='setSfx'){state.settings.sfx=state.settings.sfx===false;save();renderSettings();audioSync();}
  else if(b.id==='setNature'){state.settings.nature=state.settings.nature===false;save();renderSettings();audioSync();}
  else if(b.id==='setAmb'){state.settings.amb=state.settings.amb===false;save();renderSettings();audioSync();}
  else if(b.id==='setMusic'){state.settings.music=!state.settings.music;save();renderSettings();audioSync();}
  else if(b.dataset.eng){setEngine(b.dataset.eng);}
  else if(b.id==='soundCheck'){soundCheck();}
  else if(b.dataset.vol){state.settings.vol=b.dataset.vol;save();renderSettings();audioSync();}
  else if(b.id==='setReduce'){state.settings.reduce=!state.settings.reduce;save();applySettings();renderSettings();}
  else if(b.dataset.settheme){state.settings.theme=b.dataset.settheme;save();applySettings();renderSettings();}
  else if(b.id==='setLore'){state.settings.lore=state.settings.lore===false;save();render();}
  else if(b.dataset.setnudge!==undefined){state.settings.nudge=b.dataset.setnudge||null;save();renderSettings();}
  else if(b.id==='btnOdds')openOdds();
  else if(b.id==='btnExport')openExport();
  else if(b.id==='btnRestore')openRestore();
  else if(b.id==='fbSave')saveFeedback();
  else if(b.id==='btnReport')copyText(pilotReport(),'Report copied.');
  else if(b.dataset.tool)runTool(b.dataset.tool,b);
});
function runTool(name,btn){
  if(name==='next'){nextDay(false);tab='today';renderNav();toast('A new day. Nothing was lost.');}
  else if(name==='week'){
    state.onboarded=true;state.moodAsked=true;state.nudgeAsked=true;
    for(let i=0;i<6;i++){
      if(i===2&&!['done','rest'].includes(state.status)){state.status='rest';state.history=state.history.filter(h=>h.date!==state.date);state.history.push({date:state.date,status:'rest',v:state.todayV});}
      else if(state.status!=='done'&&state.status!=='rest')earnDaily(Math.random()<.4);
      nextDay(true);
    }
    save();tab='today';render();toast('Six days passed. A pack is ready.');
  }
  else if(name==='pack'){state.packs++;save();tab='today';render();openPack();}
  else if(name==='sleep'){const T=(((state.hearth.sleep&&state.hearth.sleep.tier)||0)%3)+1;sleepRun=null;state.hearth.sleep={tier:T};save();tab='hearth';render();window.scrollTo(0,0);}
  else if(name==='wander'){if(state.wander){state.wander.ready=Date.now()-1;state.wander.notified=false;save();tab='hearth';render();window.scrollTo(0,0);wanderTick();}else toast('Nobody is out wandering.');}
  else if(name==='holo'||name==='legend'){const c=makeCard({rarity:name==='holo'?3:4,source:'pack'});state.cards.push(c);save();render();inspect(c.id);}
  else if(name==='reset'){
    if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.querySelector('b').textContent='Tap again to erase everything';return;}
    try{localStorage.removeItem(KEY);}catch(e){}
    state=fresh();bf={type:'all',mood:'all',sort:'new',page:0};tab='today';applySettings();render();openAgeGate();
  }
}
window.addEventListener('resize',()=>{if(modal.hidden){if(tab==='binder')renderBinder();}});
setInterval(wanderTick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state&&state.ageBand){const ret=checkReturn();if(!state.opens.includes(todayKey())){state.opens.push(todayKey());save();}if(ret&&modal.hidden){tab='hearth';render();window.scrollTo(0,0);}wanderTick();renderHearth();renderToday();renderNav();}});

/* ================= Start ================= */
state=load()||fresh();
let blocked=false;try{blocked=!!localStorage.getItem(BLOCK);}catch(e){}
if(blocked){showBlocked();}
else{
  rollover();const returned=checkReturn();if(!state.opens.includes(todayKey()))state.opens.push(todayKey());
  if(state.ageBand)save();
  applySettings();render();
  if(!state.ageBand)openAgeGate();else if(!state.onboarded)openVector();else if(state.seen<SEEN_V){state.seen=SEEN_V;save();openWhatsNew();}
  if(returned&&modal.hidden){tab='hearth';render();window.scrollTo(0,0);}
  wanderTick();
}

})();
</script>
